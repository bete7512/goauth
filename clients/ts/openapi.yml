                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        items:
                                            $ref: '#/components/schemas/InvitationInvitation'
                                        type: array
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Successful response
                "401":
                    description: Authentication required
            security:
                - BearerAuth: []
            summary: List my pending invitations
            tags:
                - Invitations
    /is-available:
        post:
            description: Check if an email, username, or phone is available. Provide exactly one field.
            requestBody:
                content:
                    application/json:
