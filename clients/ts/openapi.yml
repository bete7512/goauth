                        provider:
                            description: Connection used for authentication
                            type: string
                        refresh_token:
                            description: Refresh token for obtaining new access tokens
                            type: string
                        token_type:
                            default: Bearer
                            type: string
                        user:
                            $ref: '#/components/schemas/SamlUser'
                    type: object
            type: object
        SamlChallengeResponse:
            properties:
                data:
                    properties:
                        challenges:
                            items:
                                properties:
                                    data:
                                        additionalProperties: true
                                        type: object
                                    type:
                                        type: string
                                type: object
                            type: array
                        message:
                            type: string
                    type: object
            type: object
        SamlErrorResponse:
            properties:
                error:
                    properties:
                        code:
                            enum:
                                - SAML_PROVIDER_NOT_FOUND
                                - SAML_INVALID_REQUEST
                                - SAML_REQUEST_EXPIRED
                                - SAML_INVALID_RESPONSE
                                - SAML_IDP_INITIATED_DISABLED
                                - SAML_SIGNUP_DISABLED
                                - SAML_EMAIL_REQUIRED
                                - SAML_ACCOUNT_LINKING_DISABLED
                                - SAML_SUBJECT_NOT_PERSISTENT
                            type: string
                        message:
                            type: string
                    type: object
                success:
                    example: false
                    type: boolean
            type: object
        SamlProvidersResponse:
            properties:
                data:
                    properties:
                        providers:
                            items:
                                properties:
                                    login_url:
                                        format: uri
                                        type: string
                                    metadata_url:
                                        format: uri
                                        type: string
                                    name:
                                        description: Connection name
                                        type: string
                                type: object
                            type: array
                    type: object
            type: object
        SamlUser:
            properties:
                active:
                    type: boolean
                avatar:
                    format: uri
                    type: string
                created_at:
                    format: date-time
                    type: string
                email:
                    format: email
                    type: string
                email_verified:
                    type: boolean
                first_name:
                    type: string
                id:
                    format: uuid
                    type: string
                last_login_at:
                    format: date-time
                    type: string
                last_name:
                    type: string
                name:
                    type: string
                username:
                    type: string
            type: object
        StatelessAuthResponse:
            properties:
                data:
                    properties:
                        access_token:
                            type: string
                        challenges:
                            description: Login challenges (e.g. 2FA) if any
                            items:
                                type: object
                            type: array
                        expires_in:
                            description: Token lifetime in seconds
                            type: integer
                        message:
                            type: string
                        refresh_token:
                            type: string
                        user:
                            $ref: '#/components/schemas/StatelessUserDTO'
                    type: object
                success:
                    example: true
                    type: boolean
            type: object
        StatelessErrorResponse:
            properties:
                data:
                    properties:
                        code:
                            example: INVALID_CREDENTIALS
                            type: string
                        message:
                            example: Invalid email or password
                            type: string
                    type: object
                success:
                    example: false
                    type: boolean
            type: object
        StatelessMessageResponse:
            properties:
                data:
                    properties:
                        message:
                            type: string
                    type: object
                success:
                    type: boolean
            type: object
        StatelessUserDTO:
            properties:
                active:
                    type: boolean
                created_at:
                    format: date-time
                    type: string
                email:
                    type: string
                email_verified:
                    type: boolean
                id:
                    type: string
                name:
                    type: string
                username:
                    type: string
            type: object
        TeamTeam:
            properties:
                ancestors:
                    description: The IDs of the teams above, top first
                    items:
                        type: string
                    type: array
                created_at:
                    format: date-time
                    type: string
                depth:
                    description: 0 for a top-level team
                    type: integer
                description:
                    type: string
                id:
                    type: string
                name:
                    type: string
                org_id:
                    type: string
                parent_id:
                    description: Absent for a top-level team
                    type: string
                slug:
                    type: string
                updated_at:
                    format: date-time
                    type: string
            type: object
        TeamTeamListResponse:
            properties:
                list:
                    items:
                        $ref: '#/components/schemas/TeamTeam'
                    type: array
                sort_dir:
                    enum:
                        - asc
                        - desc
                    type: string
                sort_field:
                    type: string
                total:
                    type: integer
            type: object
        TeamTeamMember:
            properties:
                created_at:
                    format: date-time
                    type: string
                role:
                    enum:
                        - lead
                        - member
                    type: string
                team_id:
                    type: string
                user_id:
                    type: string
            type: object
        TeamTeamMemberListResponse:
            properties:
                list:
                    items:
                        $ref: '#/components/schemas/TeamTeamMember'
                    type: array
                sort_dir:
                    enum:
                        - asc
                        - desc
                    type: string
                sort_field:
                    type: string
                total:
                    type: integer
            type: object
        TeamTeamRequest:
            properties:
                description:
                    maxLength: 1000
                    type: string
                name:
                    maxLength: 255
                    type: string
                parent_id:
                    description: Only when creating; empty for a top-level team
                    type: string
                slug:
                    description: Made from the name when empty
                    maxLength: 100
                    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
                    type: string
            required:
                - name
            type: object
        TwofactorErrorResponse:
            properties:
                code:
                    description: HTTP status code
                    example: 401
                    type: integer
                error:
                    description: Error message
                    example: Invalid code
                    type: string
                message:
                    description: Additional error information
                    example: The provided verification code is invalid
                    type: string
            type: object
        TwofactorMessageResponse:
            properties:
                message:
                    description: Response message
                    example: Two-factor authentication enabled successfully
                    type: string
                success:
                    description: Operation success status
                    example: true
                    type: boolean
            type: object
        TwofactorTwoFactorAuthResponse:
            properties:
                access_token:
                    description: JWT access token
                    type: string
                expires_in:
                    description: Access token TTL in seconds
                    example: 2592000
                    type: integer
                message:
                    example: 2FA verification successful - tokens issued
                    type: string
                refresh_token:
                    description: Refresh token
                    type: string
                session_id:
                    description: Session ID (session-based auth only)
                    format: uuid
                    type: string
                user:
                    properties:
                        email:
                            format: email
                            type: string
                        id:
                            format: uuid
                            type: string
                        name:
                            type: string
                    type: object
            type: object
        TwofactorTwoFactorSetupResponse:
            properties:
                backup_codes:
                    description: One-time backup codes — save these securely, shown only once
                    example:
                        - ABCD-EFGH
                        - IJKL-MNOP
                    items:
                        type: string
                    type: array
                message:
                    description: Setup instructions
                    example: Scan the QR code with your authenticator app, then verify with a code to enable 2FA
                    type: string
                qr_url:
                    description: QR code URL — scan with authenticator app (Google Authenticator, Authy, etc.)
                    example: otpauth://totp/GoAuth:user@example.com?secret=JBSWY3DPEHPK3PXP&issuer=GoAuth
                    format: uri
                    type: string
                secret:
                    description: TOTP secret key (base32 encoded) — store securely
                    example: JBSWY3DPEHPK3PXP
                    type: string
            type: object
        TwofactorTwoFactorStatusResponse:
            properties:
                enabled:
                    description: Whether 2FA is enabled
                    example: true
                    type: boolean
                method:
                    description: 2FA method being used
                    enum:
                        - totp
                        - sms
                        - email
                    example: totp
                    type: string
                verified:
                    description: Whether 2FA has been verified
                    example: true
                    type: boolean
            type: object
        TwofactorTwoFactorVerifyLoginRequest:
            properties:
                code:
                    description: 6-digit TOTP code from authenticator app, or 8-character backup code (e.g. "ABCD-EFGH")
                    example: "123456"
                    type: string
                temp_token:
                    description: Single-use temporary token bound to a verified primary login
                    example: eyJhbGci...
                    type: string
            required:
                - temp_token
                - code
            type: object
        TwofactorTwoFactorVerifyRequest:
            properties:
                code:
                    description: 6-digit TOTP code from authenticator app (or 8-character backup code e.g. "ABCD-EFGH")
                    example: "123456"
                    type: string
            required:
                - code
            type: object
    securitySchemes:
        AccessToken:
            description: An access token issued by the token endpoint. It is opaque and only valid at the UserInfo endpoint.
            scheme: bearer
            type: http
        BearerAuth:
            bearerFormat: JWT
            scheme: bearer
            type: http
        ClientBasic:
            description: The client's `client_id` and `client_secret`, form-encoded before Base64 (RFC 6749 section 2.3.1)
            scheme: basic
            type: http
        bearerAuth:
            bearerFormat: JWT
            scheme: bearer
            type: http
        captchaToken:
            description: |
                Captcha verification token from a client-side widget (Google reCAPTCHA v3 or Cloudflare Turnstile). Required on routes configured with captcha protection (typically signup and login).
            in: header
            name: X-Captcha-Token
            type: apiKey
        cookieAuth:
            in: cookie
            name: goauth_access_session
            type: apiKey
        csrfToken:
            description: |
                CSRF token for state-changing requests. Obtain a token from GET /csrf-token, then include it in the X-CSRF-Token header on POST/PUT/DELETE/PATCH requests.
            in: header
            name: X-CSRF-Token
            type: apiKey
info:
    description: Merged OpenAPI spec for the GoAuth authentication library. Generated by clients/ts/scripts/merge-openapi.go — do not edit by hand.
    title: GoAuth API
    version: 0.0.0
openapi: 3.0.3
paths:
    /.well-known/jwks.json:
        get:
            description: |
                Returns the active public key in JWKS format (RFC 7517) so downstream
                consumers (API gateways, microservices) can verify access and stateless
                refresh tokens without sharing a secret. Only served when
                `SecurityConfig.JWTAlgorithm` is asymmetric (`RS256` or `ES256`); a
                `HS256` deployment returns 404 because the symmetric secret must not be
                exposed.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreJWKS'
                    description: JWKS document
                "404":
                    description: Not available — the deployment is using HS256
            summary: Public JSON Web Key Set
            tags:
                - Core Authentication Module Docs
    /2fa/disable:
        post:
            description: Disable 2FA for the authenticated user. Requires current TOTP code to confirm.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TwofactorTwoFactorVerifyRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TwofactorMessageResponse'
                    description: 2FA disabled successfully
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TwofactorErrorResponse'
                    description: Invalid or missing code
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TwofactorErrorResponse'
                    description: Not authenticated
            security:
                - cookieAuth: []
                - bearerAuth: []
            summary: Disable two-factor authentication
            tags:
                - Two-Factor Authentication Module
    /2fa/setup:
        post:
            description: Initialize 2FA setup for the authenticated user and get QR code
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TwofactorTwoFactorSetupResponse'
                    description: 2FA setup initiated successfully
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TwofactorErrorResponse'
                    description: Not authenticated
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TwofactorErrorResponse'
                    description: Internal server error
            security:
                - cookieAuth: []
                - bearerAuth: []
            summary: Setup two-factor authentication
            tags:
                - Two-Factor Authentication Module
    /2fa/status:
        get:
            description: Retrieve the current 2FA status for the authenticated user
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TwofactorTwoFactorStatusResponse'
                    description: 2FA status retrieved successfully
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TwofactorErrorResponse'
                    description: Not authenticated
            security:
                - cookieAuth: []
                - bearerAuth: []
            summary: Get two-factor authentication status
            tags:
                - Two-Factor Authentication Module
    /2fa/verify:
        post:
            description: Verify the TOTP code from authenticator app and enable 2FA
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TwofactorTwoFactorVerifyRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TwofactorMessageResponse'
                    description: 2FA enabled successfully
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TwofactorErrorResponse'
                    description: Invalid request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TwofactorErrorResponse'
                    description: Invalid code or not authenticated
            security:
                - cookieAuth: []
                - bearerAuth: []
            summary: Verify and enable two-factor authentication
            tags:
                - Two-Factor Authentication Module
    /2fa/verify-login:
        post:
            description: |
                Submit a TOTP code (or backup code) to complete the login flow after receiving
                a `TWO_FACTOR_REQUIRED` challenge from the login endpoint.
                Use the `temp_token` returned by the login challenge in the request body.
                On success, returns the same tokens as a normal login response.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TwofactorTwoFactorVerifyLoginRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TwofactorTwoFactorAuthResponse'
                    description: 2FA verified — authentication tokens issued
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TwofactorErrorResponse'
                    description: Missing or invalid request fields
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TwofactorErrorResponse'
                    description: Invalid or expired temp_token / wrong TOTP code
            summary: Complete login with two-factor authentication
            tags:
                - Two-Factor Authentication Module
    /admin/audit:
        get:
            description: Retrieve all audit logs (admin only)
            parameters:
                - $ref: '#/components/parameters/AuditLimit'
                - $ref: '#/components/parameters/AuditOffset'
                - $ref: '#/components/parameters/AuditSortField'
                - $ref: '#/components/parameters/AuditSortDir'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuditAuditLogListResponse'
                    description: Successful response
                "403":
                    description: Forbidden - super admin access required
            security:
                - BearerAuth: []
            summary: List all audit logs
            tags:
                - Audit Logs
    /admin/audit/actions/{action}:
        get:
            description: Retrieve audit logs filtered by action type (admin only)
            parameters:
                - description: Action type (e.g., "auth.login.success", "admin.user.delete")
                  example: auth.login.success
                  in: path
                  name: action
                  required: true
                  schema:
                    type: string
                - $ref: '#/components/parameters/AuditLimit'
                - $ref: '#/components/parameters/AuditOffset'
                - $ref: '#/components/parameters/AuditSortField'
                - $ref: '#/components/parameters/AuditSortDir'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuditAuditLogListResponse'
                    description: Successful response
                "403":
                    description: Forbidden - super admin access required
            security:
                - BearerAuth: []
            summary: Get audit logs by action
            tags:
                - Audit Logs
    /admin/audit/cleanup:
        post:
            description: Deletes old audit logs based on the configured retention policy (admin only)
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    message:
                                        example: audit log cleanup completed successfully
                                        type: string
                                type: object
                    description: Cleanup completed successfully
                "401":
                    description: Unauthorized
                "403":
                    description: Forbidden - admin access required
                "500":
                    description: Internal server error
            security:
                - BearerAuth: []
            summary: Trigger audit log cleanup
            tags:
                - Audit Logs
    /admin/audit/users/{id}:
        get:
            description: Retrieve audit logs for a specific user (admin only)
            parameters:
                - description: User ID
                  in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
                - $ref: '#/components/parameters/AuditLimit'
                - $ref: '#/components/parameters/AuditOffset'
                - $ref: '#/components/parameters/AuditSortField'
                - $ref: '#/components/parameters/AuditSortDir'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuditAuditLogListResponse'
                    description: Successful response
                "403":
                    description: Forbidden - super admin access required
            security:
                - BearerAuth: []
            summary: Get user audit logs
            tags:
                - Audit Logs
    /admin/oidc/clients:
        get:
            operationId: idp.admin.clients.list
            parameters:
                - $ref: '#/components/parameters/IdpLimit'
                - $ref: '#/components/parameters/IdpOffset'
                - $ref: '#/components/parameters/IdpClientSortField'
                - $ref: '#/components/parameters/IdpSortDir'
                - description: Search name and client_id
                  in: query
                  name: q
                  schema:
                    type: string
                - description: Only clients declared in configuration (true) or registered through this API (false)
                  in: query
                  name: managed
                  schema:
                    type: boolean
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        properties:
                                            list:
                                                items:
                                                    $ref: '#/components/schemas/IdpClient'
                                                type: array
                                            sort_dir:
                                                enum:
                                                    - asc
                                                    - desc
                                                example: desc
                                                type: string
                                            sort_field:
                                                example: created_at
                                                type: string
                                            total:
                                                type: integer
                                        type: object
                                type: object
                    description: Client applications
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpErrorResponse'
                    description: Not signed in
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpErrorResponse'
                    description: Not an administrator
            security:
                - BearerAuth: []
            summary: List client applications
            tags:
                - OIDC Admin
        post:
            description: |
                Creates a client and returns its `client_secret`. This response is the
                only place the secret is ever shown; only its digest is stored. A
                public client gets no secret.
            operationId: idp.admin.clients.create
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/IdpClientRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/IdpClient'
                                type: object
                    description: The client, with its secret
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpErrorResponse'
                    description: '`IDP_INVALID_CLIENT`: the registration is not acceptable'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpErrorResponse'
                    description: Not signed in
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpErrorResponse'
                    description: Not an administrator
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpErrorResponse'
                    description: '`IDP_CLIENT_EXISTS`: the client_id is taken'
            security:
                - BearerAuth: []
            summary: Register a client application
            tags:
                - OIDC Admin
    /admin/oidc/clients/{id}:
        delete:
            description: Removes the client and disconnects every user from it.
            operationId: idp.admin.clients.delete
            parameters:
                - $ref: '#/components/parameters/IdpClientRowID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpMessageResponse'
                    description: Deleted
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpErrorResponse'
                    description: '`IDP_CLIENT_NOT_FOUND`'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpErrorResponse'
                    description: '`IDP_CLIENT_MANAGED`'
            security:
                - BearerAuth: []
            summary: Delete a client application
            tags:
                - OIDC Admin
        get:
            operationId: idp.admin.clients.get
            parameters:
                - $ref: '#/components/parameters/IdpClientRowID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/IdpClient'
                                type: object
                    description: The client, without its secret
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpErrorResponse'
                    description: '`IDP_CLIENT_NOT_FOUND`'
            security:
                - BearerAuth: []
            summary: Get a client application
            tags:
                - OIDC Admin
        put:
            description: |
                Replaces every field of the registration; `client_id` never changes
                and is ignored. A client that stops being public gets a secret,
                returned once in this response; one that becomes public loses its
                secret.
            operationId: idp.admin.clients.update
            parameters:
                - $ref: '#/components/parameters/IdpClientRowID'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/IdpClientRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/IdpClient'
                                type: object
                    description: The updated client
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpErrorResponse'
                    description: '`IDP_INVALID_CLIENT`'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpErrorResponse'
                    description: '`IDP_CLIENT_NOT_FOUND`'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpErrorResponse'
                    description: '`IDP_CLIENT_MANAGED`: the client is declared in configuration'
            security:
                - BearerAuth: []
            summary: Replace a client application's registration
            tags:
                - OIDC Admin
    /admin/oidc/clients/{id}/secret:
        post:
            description: |
                Replaces the secret of a confidential client and returns the new one,
                once. The old secret stops working at once.
            operationId: idp.admin.clients.secret
            parameters:
                - $ref: '#/components/parameters/IdpClientRowID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/IdpClient'
                                type: object
                    description: The client, with its new secret
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpErrorResponse'
                    description: '`IDP_INVALID_CLIENT`: a public client has no secret'
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpErrorResponse'
                    description: '`IDP_CLIENT_NOT_FOUND`'
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpErrorResponse'
                    description: '`IDP_CLIENT_MANAGED`'
            security:
                - BearerAuth: []
            summary: Rotate a client secret
            tags:
                - OIDC Admin
    /admin/users:
        get:
            description: Retrieve a paginated list of all users (admin only)
            parameters:
                - $ref: '#/components/parameters/AdminLimit'
                - $ref: '#/components/parameters/AdminOffset'
                - $ref: '#/components/parameters/AdminSortField'
                - $ref: '#/components/parameters/AdminSortDir'
                - description: Search users by name, email, or username
                  in: query
                  name: query
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        properties:
                                            list:
                                                items:
                                                    $ref: '#/components/schemas/AdminUser'
                                                type: array
                                            sort_dir:
                                                enum:
                                                    - asc
                                                    - desc
                                                example: desc
                                                type: string
                                            sort_field:
                                                example: created_at
                                                type: string
                                            total:
                                                type: integer
                                        type: object
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Successful response
                "401":
