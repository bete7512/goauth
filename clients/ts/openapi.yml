                - Members
        put:
            description: Change a member's role. Requires admin or owner role. Cannot demote the org owner.
            parameters:
                - $ref: '#/components/parameters/OrganizationOrgId'
                - $ref: '#/components/parameters/OrganizationUserId'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OrganizationUpdateRoleRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        nullable: true
                                        type: object
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Role updated
                "400":
                    description: Invalid role
                "401":
                    description: Authentication required
                "403":
                    description: Insufficient role or cannot demote owner
                "404":
                    description: Member not found
            security:
                - BearerAuth: []
            summary: Update member role
            tags:
                - Members
    /org/invitations/accept:
        post:
            description: |
                Accept an organization invitation by token. No authentication required — the token is the authorization.
                If the invited email has no account, a new user is created (name and password required).
                If the user already exists, the invitation is accepted and org membership is created.
                Returns auth tokens and membership details.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OrganizationAcceptInvitationRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/OrganizationAcceptOrgInvitationResponse'
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Invitation accepted, membership created, auth tokens returned
                "400":
                    description: Missing token, expired, or missing name/password for new user
                "404":
                    description: Invitation not found
                "409":
                    description: Already a member of this organization
            summary: Accept org invitation (public)
            tags:
                - Invitations
    /org/invitations/decline:
        post:
            description: Decline an organization invitation by token. No authentication required.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OrganizationInvitationTokenRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        nullable: true
                                        type: object
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Invitation declined
                "400":
                    description: Missing token
                "404":
                    description: Invitation not found
            summary: Decline org invitation (public)
            tags:
                - Invitations
    /org/my:
        get:
            description: List all organizations the authenticated user belongs to
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        items:
                                            $ref: '#/components/schemas/OrganizationOrganization'
                                        type: array
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Successful response
                "401":
                    description: Authentication required
            security:
                - BearerAuth: []
            summary: List my organizations
            tags:
                - Organizations
    /org/my/invitations:
        get:
            description: List all pending invitations for the authenticated user's email
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        items:
                                            $ref: '#/components/schemas/OrganizationInvitation'
                                        type: array
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Successful response
                "401":
                    description: Authentication required
            security:
                - BearerAuth: []
            summary: List my pending invitations
            tags:
                - Invitations
    /org/switch:
        post:
            description: Switch the user's active organization context. Returns new JWT tokens with the target org's claims.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OrganizationSwitchOrgRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/OrganizationTokenPair'
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Switched successfully, new tokens returned
                "400":
                    description: Missing org_id
                "401":
                    description: Authentication required
                "403":
                    description: User is not a member of the target organization
            security:
                - BearerAuth: []
            summary: Switch active organization
            tags:
                - Organizations
    /passkeys:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/PasskeysPasskeySummary'
                                type: array
                    description: List of passkeys
            security:
                - bearerAuth: []
            summary: List user's passkeys
            tags:
                - Passkeys Module Docs
    /passkeys/{id}:
        delete:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Deleted
                "403":
                    description: Passkey does not belong to user
                "404":
                    description: Not found
            security:
                - bearerAuth: []
            summary: Revoke a passkey
            tags:
                - Passkeys Module Docs
        put:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PasskeysRenameRequest'
                required: true
            responses:
                "200":
                    description: Renamed
                "403":
                    description: Passkey does not belong to user
                "404":
                    description: Not found
            security:
                - bearerAuth: []
            summary: Rename a passkey
            tags:
                - Passkeys Module Docs
    /passkeys/login/begin:
        post:
            description: |
                Start a discoverable-credential WebAuthn assertion ceremony. The client
                is not required to supply a username — the authenticator chooses the
                credential.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PasskeysBeginLoginResponse'
                    description: Assertion options
            summary: Begin passkey login
            tags:
                - Passkeys Module Docs
    /passkeys/login/finish:
        post:
            description: Verify the assertion and issue access + refresh tokens on success.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PasskeysFinishLoginRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PasskeysAuthResponse'
                    description: Auth tokens
                "401":
                    description: Invalid assertion
            summary: Finish passkey login
            tags:
                - Passkeys Module Docs
    /passkeys/register/begin:
        post:
            description: |
                Start a WebAuthn registration ceremony for the authenticated user.
                Returns PublicKeyCredentialCreationOptions for navigator.credentials.create()
                plus an opaque `challenge_token` the client must send back with the
                registration response.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PasskeysBeginRegistrationResponse'
                    description: Creation options
            security:
                - bearerAuth: []
            summary: Begin passkey registration
            tags:
                - Passkeys Module Docs
    /passkeys/register/finish:
        post:
            description: Verify the attestation produced by the authenticator and persist the credential.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PasskeysFinishRegistrationRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PasskeysPasskeySummary'
                    description: Passkey registered
                "400":
                    description: Invalid attestation or expired challenge
            security:
                - bearerAuth: []
            summary: Finish passkey registration
            tags:
                - Passkeys Module Docs
    /profile:
        put:
            description: Update user profile information
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CoreUpdateProfileRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreUserDTO'
                    description: Profile updated successfully
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Validation error
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Not authenticated
            security:
                - cookieAuth: []
                  csrfToken: []
                - bearerAuth: []
                  csrfToken: []
            summary: Update user profile
            tags:
                - Core Authentication Module Docs
    /refresh:
        post:
            description: |
                The old refresh token is revoked after use (rotation).
                Reusing an old refresh token will fail with 401.
            operationId: statelessRefresh
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                refresh_token:
                                    description: JWT refresh token from login or previous refresh
                                    type: string
                            required:
                                - refresh_token
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StatelessAuthResponse'
                    description: Tokens refreshed
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StatelessErrorResponse'
                    description: Invalid or revoked refresh token
            summary: Exchange a refresh token for new access and refresh tokens
            tags:
                - Authentication
    /resend-verification-email:
        post:
            description: Resend verification email (deletes any existing token first)
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CoreSendVerificationEmailRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreMessageResponse'
                    description: Verification email resent
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Validation error
            security:
                - csrfToken: []
            summary: Resend email verification
            tags:
                - Core Authentication Module Docs
    /resend-verification-phone:
        post:
            description: Resend verification SMS (deletes any existing token first)
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CoreSendVerificationPhoneRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreMessageResponse'
                    description: Verification SMS resent
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Validation error
            security:
                - csrfToken: []
            summary: Resend phone verification
            tags:
                - Core Authentication Module Docs
    /reset-password:
        post:
            description: Reset password using token/code from email/SMS
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CoreResetPasswordRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreMessageResponse'
                    description: Password reset successfully
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Validation error or invalid token/code
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: User not found
            security:
                - csrfToken: []
            summary: Reset password
            tags:
                - Core Authentication Module Docs
    /send-verification-email:
        post:
            description: Send verification email to user's email address
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CoreSendVerificationEmailRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreMessageResponse'
                    description: Verification email sent (always succeeds to prevent user enumeration)
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Validation error
            security:
                - csrfToken: []
            summary: Send email verification
            tags:
                - Core Authentication Module Docs
    /send-verification-phone:
        post:
            description: Send verification SMS with OTP code to user's phone number
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CoreSendVerificationPhoneRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreMessageResponse'
                    description: Verification SMS sent (always succeeds to prevent user enumeration)
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Validation error
            security:
                - csrfToken: []
            summary: Send phone verification
            tags:
                - Core Authentication Module Docs
    /signup:
        post:
            description: Create a new user account with email/password
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CoreSignupRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreAuthResponse'
                    description: User created successfully
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Validation error
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: User already exists
            security:
                - csrfToken: []
            summary: Register a new user
            tags:
                - Core Authentication Module Docs
    /verify-email:
        get:
            description: Verify email using token from email link. Redirects to frontend with success/error status if frontend config is set, otherwise returns JSON.
            parameters:
                - description: Verification token from email
                  example: abc123def456
                  in: query
                  name: token
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreMessageResponse'
                    description: Email verified (JSON fallback when no frontend config)
                "302":
                    description: Redirects to frontend verify-email page with status query parameter
                    headers:
                        Location:
                            description: Redirect URL to frontend
                            schema:
                                example: http://localhost:3000/verify-email?status=success
                                type: string
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Invalid or expired token
            summary: Verify email address
            tags:
                - Core Authentication Module Docs
    /verify-phone:
        post:
            description: Verify phone number using 6-digit OTP code from SMS
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CoreVerifyPhoneRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreMessageResponse'
                    description: Phone verified successfully
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Invalid or expired code
            security:
                - csrfToken: []
            summary: Verify phone number
            tags:
                - Core Authentication Module Docs
servers:
    - description: Configured BasePath
      url: '{baseUrl}'
      variables:
        baseUrl:
            default: /auth
            description: Value of config.BasePath
tags:
    - description: Audit Logs log management endpoints
      name: Audit Logs
    - description: Core Authentication Module API Documentation - Handles user authentication, profile management, email/phone verification, password recovery, and account operations
      name: Core Authentication Module Docs
    - description: Organization invitation flow
      name: Invitations
    - description: Organization member management
      name: Members
    - description: OAuth 2.0 / OpenID Connect authentication endpoints
      name: OAuth
    - description: Organization CRUD and switching
      name: Organizations
    - description: |
        WebAuthn / Passkeys — phishing-resistant, shared-secret-free authentication.
        v1 supports primary login via discoverable credentials plus post-signup
        credential management. Use-as-2FA (passkey as a second factor during
        password login) is planned for v1.1 via the AuthInterceptors framework.
      name: Passkeys Module Docs
    - description: Two-factor authentication (2FA) endpoints for enhanced account security
      name: Two-Factor Authentication Module
    - description: User management endpoints
      name: Users
