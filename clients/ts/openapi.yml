                    format: uuid
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AdminUser'
                    description: Successful response
                "403":
                    description: Forbidden - super admin access required
                "404":
                    description: User not found
            security:
                - BearerAuth: []
