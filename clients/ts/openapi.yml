                    description: Availability check completed
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Validation error (missing field, multiple fields, or invalid format)
            security:
                - csrfToken: []
            summary: Check email/phone/username availability
            tags:
                - Core Authentication Module Docs
    /login:
        post:
            operationId: statelessLogin
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                email:
                                    description: User email (required if username not provided)
                                    format: email
                                    type: string
                                password:
                                    format: password
                                    type: string
                                username:
                                    description: Username (required if email not provided)
                                    type: string
                            required:
                                - password
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StatelessAuthResponse'
                    description: Login successful
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StatelessErrorResponse'
                    description: Invalid credentials
                "423":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StatelessErrorResponse'
                    description: Account locked due to too many failed attempts
            summary: Authenticate with email/username and password
            tags:
                - Authentication
    /logout:
        post:
            operationId: statelessLogout
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StatelessMessageResponse'
                    description: Logout successful
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StatelessErrorResponse'
                    description: Unauthorized
            security:
                - BearerAuth: []
            summary: Revoke all refresh tokens for the authenticated user
            tags:
                - Authentication
    /magic-link/resend:
        post:
            description: Resend a magic link to the user's email. Deletes the previous token and generates a new one.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/MagiclinkMagicLinkSendRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MagiclinkMessageResponse'
                    description: Magic link resent
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MagiclinkErrorResponse'
                    description: Validation error
            summary: Resend magic link
            tags:
                - Magic Link Module Docs
    /magic-link/send:
        post:
            description: |
                Send a passwordless sign-in message to the user's email. The email contains
                a link, a 6-digit code, or both — controlled by the module's `DeliveryMode`
                config (`link` | `code` | `both`, default `both`). If auto-register is
                enabled and the email is not found, a new account is created automatically.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/MagiclinkMagicLinkSendRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MagiclinkMessageResponse'
                    description: Magic link sent (generic message regardless of whether the email exists)
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MagiclinkErrorResponse'
                    description: Validation error
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MagiclinkErrorResponse'
                    description: Internal server error
            summary: Send magic link / email OTP
            tags:
                - Magic Link Module Docs
    /magic-link/verify:
        get:
            description: |
                Verify the magic link token from the email. Behavior depends on configuration:
                - If `CallbackURL` is configured, redirects to the frontend with tokens in the URL fragment.
                - Otherwise, sets auth cookies and returns a JSON AuthResponse.
            parameters:
                - description: The magic link token from the email
                  in: query
                  name: token
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MagiclinkAuthResponse'
                    description: Token verified, auth tokens returned
                    headers:
                        Set-Cookie:
                            schema:
                                description: Auth cookies (access + refresh tokens)
                                type: string
                "302":
                    description: Redirect to CallbackURL with tokens in URL fragment (when CallbackURL is configured)
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MagiclinkErrorResponse'
                    description: Invalid or expired token
            summary: Verify magic link token
            tags:
                - Magic Link Module Docs
    /magic-link/verify-code:
        post:
            description: |
                Verify the 6-digit OTP code associated with the given email. Used as the
                primary entrypoint when `DeliveryMode` is `code`, and as a fallback for
                email clients that mangle URLs when mode is `both`. After `MaxCodeAttempts`
                failed attempts (default 5) the code is invalidated and the user must
                request a new one.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/MagiclinkMagicLinkVerifyByCodeRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MagiclinkAuthResponse'
                    description: Code verified, auth tokens returned
                    headers:
                        Set-Cookie:
                            schema:
                                description: Auth cookies (access + refresh tokens)
                                type: string
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MagiclinkErrorResponse'
                    description: Invalid email or code
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MagiclinkErrorResponse'
                    description: Too many failed attempts for this code — request a new one
            summary: Verify email OTP code
            tags:
                - Magic Link Module Docs
    /me:
