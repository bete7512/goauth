                - $ref: '#/components/parameters/AuditSortDir'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuditAuditLogListResponse'
                    description: Successful response
            security:
                - BearerAuth: []
            summary: Get my profile changes
            tags:
                - Audit Logs
    /me/audit/logins:
        get:
            description: Retrieve login history for the current user
            parameters:
                - $ref: '#/components/parameters/AuditLimit'
                - $ref: '#/components/parameters/AuditOffset'
                - $ref: '#/components/parameters/AuditSortField'
                - $ref: '#/components/parameters/AuditSortDir'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuditAuditLogListResponse'
                    description: Successful response
                "401":
