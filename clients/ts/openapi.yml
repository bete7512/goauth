                - Users
    /change-password:
        put:
            description: Change user password (requires old password)
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CoreChangePasswordRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreMessageResponse'
                    description: Password changed successfully
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Validation error or invalid old password
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Not authenticated
            security:
                - cookieAuth: []
                  csrfToken: []
                - bearerAuth: []
                  csrfToken: []
            summary: Change password
            tags:
                - Core Authentication Module Docs
    /csrf-token:
        get:
            description: |
                Generates a new CSRF token using HMAC-based double-submit cookie pattern.
                The token is returned in the response body and also set as a cookie.
                Clients must include this token in the X-CSRF-Token header (or csrf_token form field)
                on all state-changing requests (POST, PUT, DELETE, PATCH).
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CsrfCSRFTokenResponse'
                    description: CSRF token generated successfully
                    headers:
                        Set-Cookie:
                            description: CSRF cookie (non-HttpOnly so JS can read it)
                            schema:
                                type: string
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CsrfErrorResponse'
                    description: CSRF token generation error
            summary: Get CSRF token
            tags:
                - CSRF Module Docs
    /forgot-password:
        post:
            description: Send password reset link/code via email or SMS
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CoreForgotPasswordRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreMessageResponse'
                    description: Password reset instructions sent (always succeeds to prevent user enumeration)
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Validation error
            security:
                - csrfToken: []
            summary: Request password reset
            tags:
                - Core Authentication Module Docs
    /invitations:
        get:
            description: List invitations sent by the authenticated user with pagination and filtering
            parameters:
                - $ref: '#/components/parameters/InvitationLimit'
                - $ref: '#/components/parameters/InvitationOffset'
                - $ref: '#/components/parameters/InvitationInvitationSortField'
                - $ref: '#/components/parameters/InvitationSortDir'
                - description: Filter invitations by status
                  in: query
                  name: status
                  schema:
                    enum:
                        - pending
                        - accepted
                        - declined
                        - expired
                    type: string
                - description: Filter invitations by purpose
                  in: query
                  name: purpose
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        properties:
                                            list:
                                                items:
                                                    $ref: '#/components/schemas/InvitationInvitation'
                                                type: array
                                            sort_dir:
                                                enum:
                                                    - asc
                                                    - desc
                                                example: desc
                                                type: string
                                            sort_field:
                                                example: created_at
                                                type: string
                                            total:
                                                type: integer
                                        type: object
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Successful response
                "401":
                    description: Authentication required
            security:
                - BearerAuth: []
            summary: List my sent invitations
            tags:
                - Invitations
        post:
            description: Send a standalone invitation to an email address. The inviter must be authenticated.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvitationSendInvitationRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/InvitationInvitation'
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Invitation sent
                "400":
                    description: Invalid request (missing email or invalid purpose)
                "401":
                    description: Authentication required
                "409":
                    description: A pending invitation already exists for this email and purpose
            security:
                - BearerAuth: []
            summary: Send invitation
            tags:
                - Invitations
    /invitations/{invId}:
        delete:
            description: Cancel a pending invitation. Only the inviter can cancel their own invitations.
            parameters:
                - description: Invitation ID
                  in: path
                  name: invId
                  required: true
                  schema:
                    format: uuid
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        nullable: true
                                        type: object
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Invitation cancelled
                "401":
                    description: Authentication required
                "404":
                    description: Invitation not found or not owned by the caller
            security:
                - BearerAuth: []
            summary: Cancel invitation
            tags:
                - Invitations
    /invitations/accept:
        post:
            description: |
                Accept a standalone invitation by token. No authentication required — the token is the authorization.
                If the invited email has no account, a new user is created (name and password required).
                If the user already exists, the invitation is simply accepted.
                Returns auth tokens so the user is immediately logged in.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvitationAcceptInvitationRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/InvitationAcceptInvitationResponse'
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Invitation accepted, auth tokens returned
                "400":
                    description: Missing token, expired, or missing name/password for new user
                "404":
                    description: Invitation not found
            summary: Accept invitation (public)
            tags:
                - Invitations
    /invitations/decline:
        post:
            description: Decline a standalone invitation by token. No authentication required.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/InvitationInvitationTokenRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        nullable: true
                                        type: object
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Invitation declined
                "400":
                    description: Missing token
                "404":
                    description: Invitation not found
            summary: Decline invitation (public)
            tags:
                - Invitations
    /invitations/my:
        get:
            description: List all pending invitations for the authenticated user's email
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        items:
                                            $ref: '#/components/schemas/InvitationInvitation'
                                        type: array
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Successful response
                "401":
                    description: Authentication required
            security:
                - BearerAuth: []
            summary: List my pending invitations
            tags:
                - Invitations
    /is-available:
        post:
            description: Check if an email, username, or phone is available. Provide exactly one field.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CoreCheckAvailabilityRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreCheckAvailabilityResponse'
                    description: Availability check completed
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Validation error (missing field, multiple fields, or invalid format)
            security:
                - csrfToken: []
            summary: Check email/phone/username availability
            tags:
                - Core Authentication Module Docs
    /login:
        post:
            operationId: statelessLogin
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                email:
                                    description: User email (required if username not provided)
                                    format: email
                                    type: string
                                password:
                                    format: password
                                    type: string
                                username:
                                    description: Username (required if email not provided)
                                    type: string
                            required:
                                - password
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StatelessAuthResponse'
                    description: Login successful
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StatelessErrorResponse'
                    description: Invalid credentials
                "423":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StatelessErrorResponse'
                    description: Account locked due to too many failed attempts
            summary: Authenticate with email/username and password
            tags:
                - Authentication
    /logout:
        post:
            operationId: statelessLogout
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StatelessMessageResponse'
                    description: Logout successful
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StatelessErrorResponse'
                    description: Unauthorized
            security:
                - BearerAuth: []
            summary: Revoke all refresh tokens for the authenticated user
            tags:
                - Authentication
    /magic-link/resend:
        post:
            description: Resend a magic link to the user's email. Deletes the previous token and generates a new one.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/MagiclinkMagicLinkSendRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MagiclinkMessageResponse'
                    description: Magic link resent
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MagiclinkErrorResponse'
                    description: Validation error
            summary: Resend magic link
            tags:
                - Magic Link Module Docs
    /magic-link/send:
        post:
            description: |
                Send a passwordless sign-in message to the user's email. The email contains
                a link, a 6-digit code, or both — controlled by the module's `DeliveryMode`
                config (`link` | `code` | `both`, default `both`). If auto-register is
                enabled and the email is not found, a new account is created automatically.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/MagiclinkMagicLinkSendRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MagiclinkMessageResponse'
                    description: Magic link sent (generic message regardless of whether the email exists)
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MagiclinkErrorResponse'
                    description: Validation error
                "500":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MagiclinkErrorResponse'
                    description: Internal server error
            summary: Send magic link / email OTP
            tags:
                - Magic Link Module Docs
    /magic-link/verify:
        get:
            description: |
                Verify the magic link token from the email. Behavior depends on configuration:
                - If `CallbackURL` is configured, redirects to the frontend with tokens in the URL fragment.
                - Otherwise, sets auth cookies and returns a JSON AuthResponse.
            parameters:
                - description: The magic link token from the email
                  in: query
                  name: token
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MagiclinkAuthResponse'
                    description: Token verified, auth tokens returned
                    headers:
                        Set-Cookie:
                            schema:
                                description: Auth cookies (access + refresh tokens)
                                type: string
                "302":
                    description: Redirect to CallbackURL with tokens in URL fragment (when CallbackURL is configured)
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MagiclinkErrorResponse'
                    description: Invalid or expired token
            summary: Verify magic link token
            tags:
                - Magic Link Module Docs
    /magic-link/verify-code:
        post:
            description: |
                Verify the 6-digit OTP code associated with the given email. Used as the
                primary entrypoint when `DeliveryMode` is `code`, and as a fallback for
                email clients that mangle URLs when mode is `both`. After `MaxCodeAttempts`
                failed attempts (default 5) the code is invalidated and the user must
                request a new one.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/MagiclinkMagicLinkVerifyByCodeRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MagiclinkAuthResponse'
                    description: Code verified, auth tokens returned
                    headers:
                        Set-Cookie:
                            schema:
                                description: Auth cookies (access + refresh tokens)
                                type: string
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MagiclinkErrorResponse'
                    description: Invalid email or code
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MagiclinkErrorResponse'
                    description: Too many failed attempts for this code — request a new one
            summary: Verify email OTP code
            tags:
                - Magic Link Module Docs
    /me:
        get:
            description: Retrieve current authenticated user information
            responses:
                "200":
                    content:
                        application/json:
                            schema:
