    /admin/users/{id}:
        delete:
            description: Permanently delete a user (admin only)
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    message:
                                        type: string
                                type: object
                    description: User deleted successfully
                "403":
                    description: Forbidden - super admin access required
                "404":
                    description: User not found
            security:
                - BearerAuth: []
            summary: Delete user
            tags:
                - Users
        get:
            description: Retrieve a specific user's details (admin only)
            parameters:
                - description: User ID
                  in: path
                  name: id
                  required: true
