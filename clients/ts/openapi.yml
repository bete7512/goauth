            tags:
                - Audit Logs
    /me/audit/security:
        get:
            description: Retrieve security-related events for the current user
            parameters:
                - $ref: '#/components/parameters/AuditLimit'
                - $ref: '#/components/parameters/AuditOffset'
                - $ref: '#/components/parameters/AuditSortField'
                - $ref: '#/components/parameters/AuditSortDir'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuditAuditLogListResponse'
                    description: Successful response
            security:
                - BearerAuth: []
            summary: Get my security events
            tags:
                - Audit Logs
    /me/permissions:
        get:
            description: |
                Returns the roles the caller holds and the grants they add up to, so that
                a client can hide what the caller cannot do. The scope is the organization
                in `org_id`, else the organization the caller is signed in to, else the
                whole application. A caller who is not a member of the organization holds
                only their application-wide roles there. Rules the application attaches to
                single routes (AllowIf, OnlyIf, Decide) are not reflected here; the server
                stays the authority.
            operationId: rbac.me.permissions
            parameters:
                - $ref: '#/components/parameters/RbacScopeOrgId'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/RbacUserRoles'
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: The caller's roles and permissions
                "400":
                    description: Organization roles are not enabled (RBAC_SCOPE_UNAVAILABLE)
                "401":
                    description: Authentication required
            security:
                - BearerAuth: []
            summary: Get my roles and permissions
            tags:
                - RBAC
    /oauth/{provider}:
        delete:
            description: Removes an OAuth provider link from the current user's account
            operationId: oauth.unlink
            parameters:
                - description: OAuth provider name to unlink
                  in: path
                  name: provider
                  required: true
                  schema:
                    enum:
                        - google
                        - github
                        - microsoft
                        - discord
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OauthMessageResponse'
                    description: Provider unlinked successfully
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OauthErrorResponse'
                    description: Provider not linked or cannot unlink only login method
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OauthErrorResponse'
                    description: Unauthorized
            security:
                - BearerAuth: []
            summary: Unlink OAuth provider
            tags:
                - OAuth
        get:
            description: |
                Initiates the OAuth login flow by redirecting to the provider's authorization page.
                After authorization, the provider redirects back to the callback endpoint.
            operationId: oauth.login
            parameters:
                - description: OAuth provider name (google, github, microsoft, discord)
                  in: path
                  name: provider
                  required: true
                  schema:
                    required: true
                    type: string
                - description: |
                    Optional frontend URL to redirect to after successful authentication.
                    Tokens are passed in the URL fragment.
                  in: query
                  name: redirect_uri
                  required: false
                  schema:
                    format: uri
                    type: string
            responses:
                "302":
                    description: Redirect to OAuth provider authorization page
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OauthErrorResponse'
                    description: Invalid provider
            summary: Initiate OAuth login
            tags:
                - OAuth
    /oauth/{provider}/callback:
        get:
            description: |
                Handles the OAuth provider callback after user authorization.
                Exchanges the authorization code for tokens and authenticates the user.
            operationId: oauth.callback
            parameters:
                - description: OAuth provider name
                  in: path
                  name: provider
                  required: true
                  schema:
                    enum:
                        - google
                        - github
                        - microsoft
                        - discord
                    type: string
                - description: Authorization code from the OAuth provider
                  in: query
                  name: code
                  required: true
                  schema:
                    type: string
                - description: State parameter for CSRF protection
                  in: query
                  name: state
                  required: true
                  schema:
                    type: string
                - description: Error code if the provider returned an error
                  in: query
                  name: error
                  required: false
                  schema:
                    type: string
                - description: Error description from the provider
                  in: query
                  name: error_description
                  required: false
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OauthAuthResponse'
                    description: Authentication successful (when no redirect URL configured)
                "302":
                    description: |
                        Redirect to frontend with tokens in URL fragment.
                        Fragment format: #access_token=xxx&refresh_token=xxx&token_type=Bearer&expires_in=3600
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OauthErrorResponse'
                    description: Invalid state, expired state, or token exchange failed
            summary: OAuth callback
            tags:
                - OAuth
    /oauth/linked:
        get:
            description: Returns the OAuth providers linked to the current user's account
            operationId: oauth.linked
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OauthLinkedProvidersResponse'
                    description: List of linked providers
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OauthErrorResponse'
                    description: Unauthorized
            security:
                - BearerAuth: []
            summary: Get linked OAuth providers
            tags:
                - OAuth
    /oauth/providers:
        get:
            description: Returns the list of enabled OAuth providers
            operationId: oauth.providers
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OauthProvidersResponse'
                    description: List of enabled providers
            summary: List enabled OAuth providers
            tags:
                - OAuth
    /oidc/.well-known/openid-configuration:
        get:
            description: |
                The discovery document (OpenID Connect Discovery 1.0). Client libraries
                are configured with the issuer and read everything else from here.
            operationId: idp.discovery
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpDiscoveryDocument'
                    description: Provider metadata
            summary: OpenID Provider metadata
            tags:
                - OIDC Provider
    /oidc/authorize:
        get:
            description: |
                Starts a sign-in (OpenID Connect Core section 3.1.2). The endpoint never
                renders a page. A valid request is stored and the browser is redirected
                to the host's consent page with `?request_id=...`.

                A request whose `client_id` or `redirect_uri` cannot be verified is not
                redirected to the client: the error is shown on `ErrorURL` when it is
                configured and returned as JSON otherwise. Every other error is
                returned to the client's redirect URI with `error`, `error_description`,
                `state` and `iss`.

                Scopes the client is not registered for are left out, not refused; the
                token response states what was granted. `prompt=none` is answered with
                `interaction_required`.
            operationId: idp.authorize
            parameters:
                - in: query
                  name: client_id
                  required: true
                  schema:
                    type: string
                - description: Must equal one of the client's registered redirect URIs.
                  in: query
                  name: redirect_uri
                  required: true
                  schema:
                    format: uri
                    type: string
                - in: query
                  name: response_type
                  required: true
                  schema:
                    enum:
                        - code
                    type: string
                - description: Space-delimited; must contain `openid`.
                  in: query
                  name: scope
                  required: true
                  schema:
                    example: openid profile email
                    type: string
                - description: Opaque value returned to the client unchanged (at most 2048 characters).
                  in: query
                  name: state
                  schema:
                    type: string
                - description: Copied into the ID token (at most 512 characters).
                  in: query
                  name: nonce
                  schema:
                    type: string
                - description: PKCE challenge. Required unless the client is registered to go without.
                  in: query
                  name: code_challenge
                  schema:
                    type: string
                - in: query
                  name: code_challenge_method
                  schema:
                    enum:
                        - S256
                    type: string
                - description: |
                    Space-delimited. `login` requires a sign-in made after this
                    request, `consent` asks for approval even when it was given before,
                    `select_account` is accepted and ignored, `none` is not supported.
                  in: query
                  name: prompt
                  schema:
                    type: string
                - description: How many seconds ago the user may have signed in at most.
                  in: query
                  name: max_age
                  schema:
                    minimum: 0
                    type: integer
                - description: The account the client expects; passed on to the consent page.
                  in: query
                  name: login_hint
                  schema:
                    type: string
                - in: query
                  name: response_mode
                  schema:
                    enum:
                        - query
                    type: string
            responses:
                "302":
                    description: Redirect to the consent page, to the client with an error, or to the error page
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpOAuthError'
                    description: The client or redirect URI could not be verified and no error page is configured
            summary: Authorization endpoint
            tags:
                - OIDC Provider
    /oidc/consent/{id}:
        get:
            description: |
                What the consent page shows: the application, where the user will be
                sent and the requested scopes. `consent_required` is false when there
                is nothing to ask, in which case the page can approve without a
                prompt. `login_required` is true when the application asked for a
                fresh sign-in and the user's current one is too old.
            operationId: idp.consent.get
            parameters:
                - $ref: '#/components/parameters/IdpRequestID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/IdpConsentDetails'
                                type: object
                    description: The pending request
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpErrorResponse'
                    description: Not signed in
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpErrorResponse'
                    description: '`IDP_REQUEST_NOT_FOUND`: unknown, expired or already decided'
            security:
                - BearerAuth: []
            summary: Describe a pending sign-in request
            tags:
                - OIDC Consent
    /oidc/consent/{id}/approve:
        post:
            description: |
                Records the signed-in user's approval of every requested scope and
                returns the redirect that carries the authorization code back to the
                client. The decision is single use.

                Fails with `IDP_LOGIN_REQUIRED` when the request asks for a fresh
                sign-in (`prompt=login` or `max_age`); the request stays open, so the
                page signs the user in again and repeats the call.
            operationId: idp.consent.approve
            parameters:
                - $ref: '#/components/parameters/IdpRequestID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/IdpConsentRedirect'
                                type: object
                    description: Where to send the browser
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpErrorResponse'
                    description: Not signed in, or `IDP_LOGIN_REQUIRED`
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpErrorResponse'
                    description: '`IDP_REQUEST_NOT_FOUND`'
            security:
                - BearerAuth: []
            summary: Approve a sign-in request
            tags:
                - OIDC Consent
    /oidc/consent/{id}/deny:
        post:
            description: Records the refusal and returns the redirect that tells the client `access_denied`.
            operationId: idp.consent.deny
            parameters:
                - $ref: '#/components/parameters/IdpRequestID'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/IdpConsentRedirect'
                                type: object
                    description: Where to send the browser
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpErrorResponse'
                    description: Not signed in
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpErrorResponse'
                    description: '`IDP_REQUEST_NOT_FOUND`'
            security:
                - BearerAuth: []
            summary: Refuse a sign-in request
            tags:
                - OIDC Consent
    /oidc/grants:
        get:
            description: The applications the signed-in user approved, one entry per application.
            operationId: idp.grants.list
            parameters:
                - $ref: '#/components/parameters/IdpLimit'
                - $ref: '#/components/parameters/IdpOffset'
                - $ref: '#/components/parameters/IdpGrantSortField'
                - $ref: '#/components/parameters/IdpSortDir'
                - description: Only the grant for this application
                  in: query
                  name: client_id
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        properties:
                                            list:
                                                items:
                                                    $ref: '#/components/schemas/IdpGrant'
                                                type: array
                                            sort_dir:
                                                enum:
                                                    - asc
                                                    - desc
                                                example: desc
                                                type: string
                                            sort_field:
                                                example: created_at
                                                type: string
                                            total:
                                                type: integer
                                        type: object
                                type: object
                    description: Connected applications
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpErrorResponse'
                    description: Not signed in
            security:
                - BearerAuth: []
            summary: List connected applications
            tags:
                - OIDC Consent
    /oidc/grants/{id}:
        delete:
            description: |
                Ends the application's access and refresh tokens for the user at once.
                The user is asked to approve the application again next time.
            operationId: idp.grants.revoke
            parameters:
                - description: Grant ID
                  in: path
                  name: id
                  required: true
                  schema:
                    format: uuid
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpMessageResponse'
                    description: Disconnected
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpErrorResponse'
                    description: Not signed in
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpErrorResponse'
                    description: '`IDP_GRANT_NOT_FOUND`: no such grant, or it belongs to another user'
            security:
                - BearerAuth: []
            summary: Disconnect an application
            tags:
                - OIDC Consent
    /oidc/jwks:
        get:
            description: The public keys that verify ID tokens, as a JSON Web Key Set. Retired keys stay listed until they lapse.
            operationId: idp.jwks
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpJWKS'
                    description: JSON Web Key Set
            summary: Signing keys
            tags:
                - OIDC Provider
    /oidc/token:
        post:
            description: |
                Redeems an authorization code or a refresh token (OpenID Connect Core
                section 3.1.3, RFC 6749 section 6).

                A confidential client authenticates with HTTP Basic
                (`client_secret_basic`) or with `client_id` and `client_secret` in the
                form (`client_secret_post`), never both. A public client sends its
                `client_id` and the PKCE `code_verifier`.

                A code is redeemed once; presenting it again disconnects the
                application for that user. A refresh token rotates on every use; a
                rotated token presented again after the reuse leeway disconnects the
                application too.
            operationId: idp.token
            requestBody:
                content:
                    application/x-www-form-urlencoded:
                        schema:
                            $ref: '#/components/schemas/IdpTokenRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpTokenResponse'
                    description: Tokens
                    headers:
                        Cache-Control:
                            schema:
                                example: no-store
                                type: string
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpOAuthError'
                    description: '`invalid_request`, `invalid_grant`, `invalid_scope` or `unsupported_grant_type`'
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpOAuthError'
                    description: '`invalid_client`: client authentication failed'
            security:
                - ClientBasic: []
                - {}
            summary: Token endpoint
            tags:
                - OIDC Provider
    /oidc/userinfo:
        get:
            description: |
                Returns the claims the access token's scopes release (OpenID Connect
                Core section 5.3). The token is honored while the user's grant exists,
                the client is enabled and the user may still sign in with the password
                they had when they approved.
            operationId: idp.userinfo
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpUserInfo'
                    description: Claims about the user
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpOAuthError'
                    description: '`invalid_token`: the access token is missing, unknown, expired or revoked'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpOAuthError'
                    description: '`insufficient_scope`: the access token does not carry the `openid` scope'
            security:
                - AccessToken: []
            summary: UserInfo endpoint
            tags:
                - OIDC Provider
        post:
            description: |
                The same as GET. The access token is taken from the Authorization
                header, or from an `access_token` form field (RFC 6750 section 2.2).
                A token in the URL is not accepted.
            operationId: idp.userinfo.post
            requestBody:
                content:
                    application/x-www-form-urlencoded:
                        schema:
                            properties:
                                access_token:
                                    type: string
                            type: object
                required: false
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpUserInfo'
                    description: Claims about the user
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpOAuthError'
                    description: '`invalid_token`'
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IdpOAuthError'
                    description: '`insufficient_scope`'
            security:
                - AccessToken: []
                - {}
            summary: UserInfo endpoint (POST)
            tags:
                - OIDC Provider
    /org:
        post:
            description: Create a new organization. The authenticated user becomes the owner.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OrganizationCreateOrgRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/OrganizationOrganization'
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Organization created
                "400":
                    description: Invalid request (missing name or slug taken)
                "401":
                    description: Authentication required
            security:
                - BearerAuth: []
            summary: Create organization
            tags:
                - Organizations
    /org/{orgId}:
        delete:
            description: Permanently delete an organization and all its memberships. Requires owner role.
            parameters:
                - $ref: '#/components/parameters/OrganizationOrgId'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        nullable: true
                                        type: object
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Organization deleted
                "401":
                    description: Authentication required
                "403":
                    description: Insufficient role (requires owner)
                "404":
                    description: Organization not found
            security:
                - BearerAuth: []
            summary: Delete organization
            tags:
                - Organizations
        get:
            description: Get organization details. Requires membership (any role).
            parameters:
                - $ref: '#/components/parameters/OrganizationOrgId'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/OrganizationOrganization'
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Successful response
                "401":
                    description: Authentication required
                "403":
                    description: Not a member of this organization
                "404":
                    description: Organization not found
            security:
                - BearerAuth: []
            summary: Get organization
            tags:
                - Organizations
        put:
            description: Update organization name, logo, or metadata. Requires admin or owner role.
            parameters:
                - $ref: '#/components/parameters/OrganizationOrgId'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OrganizationUpdateOrgRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/OrganizationOrganization'
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Organization updated
                "401":
                    description: Authentication required
                "403":
                    description: Insufficient role (requires admin or owner)
                "404":
                    description: Organization not found
            security:
                - BearerAuth: []
            summary: Update organization
            tags:
                - Organizations
    /org/{orgId}/invitations:
        get:
            description: List organization invitations with pagination. Requires admin or owner role.
            parameters:
                - $ref: '#/components/parameters/OrganizationOrgId'
                - $ref: '#/components/parameters/OrganizationLimit'
                - $ref: '#/components/parameters/OrganizationOffset'
                - $ref: '#/components/parameters/OrganizationInvitationSortField'
                - $ref: '#/components/parameters/OrganizationSortDir'
                - description: Filter invitations by status
                  in: query
                  name: status
                  schema:
                    enum:
                        - pending
                        - accepted
                        - declined
                        - expired
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        properties:
                                            list:
                                                items:
                                                    $ref: '#/components/schemas/OrganizationInvitation'
                                                type: array
                                            sort_dir:
                                                enum:
                                                    - asc
                                                    - desc
                                                example: desc
                                                type: string
                                            sort_field:
                                                example: created_at
                                                type: string
                                            total:
                                                type: integer
                                        type: object
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Successful response
                "401":
                    description: Authentication required
                "403":
                    description: Insufficient role (requires admin or owner)
            security:
                - BearerAuth: []
            summary: List invitations
            tags:
                - Invitations
    /org/{orgId}/invitations/{invId}:
        delete:
            description: Cancel a pending invitation. Requires admin or owner role.
            parameters:
                - $ref: '#/components/parameters/OrganizationOrgId'
                - description: Invitation ID
                  in: path
                  name: invId
                  required: true
                  schema:
                    format: uuid
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        nullable: true
                                        type: object
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Invitation cancelled
                "401":
                    description: Authentication required
                "403":
                    description: Insufficient role (requires admin or owner)
                "404":
                    description: Invitation not found
            security:
                - BearerAuth: []
            summary: Cancel invitation
            tags:
                - Invitations
    /org/{orgId}/invite:
        post:
            description: Invite a user to the organization by email. Requires admin or owner role. Checks for duplicate invitations and member limits.
            parameters:
                - $ref: '#/components/parameters/OrganizationOrgId'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OrganizationInviteRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/OrganizationInvitation'
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Invitation sent
                "400":
                    description: Missing email or invalid role
                "401":
                    description: Authentication required
                "403":
                    description: Insufficient role (requires admin or owner)
                "409":
                    description: User is already a member or invitation already exists
                "429":
                    description: Organization has reached the maximum member limit
            security:
                - BearerAuth: []
            summary: Send invitation
            tags:
                - Invitations
    /org/{orgId}/members:
        get:
            description: List organization members with pagination. Requires membership (any role).
            parameters:
                - $ref: '#/components/parameters/OrganizationOrgId'
                - $ref: '#/components/parameters/OrganizationLimit'
                - $ref: '#/components/parameters/OrganizationOffset'
                - $ref: '#/components/parameters/OrganizationMemberSortField'
                - $ref: '#/components/parameters/OrganizationSortDir'
                - description: Filter members by role
                  in: query
                  name: role
                  schema:
                    enum:
                        - owner
                        - admin
                        - member
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        properties:
                                            list:
                                                items:
                                                    $ref: '#/components/schemas/OrganizationMemberWithUser'
                                                type: array
                                            sort_dir:
                                                enum:
                                                    - asc
                                                    - desc
                                                example: desc
                                                type: string
                                            sort_field:
                                                example: joined_at
                                                type: string
                                            total:
                                                type: integer
                                        type: object
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Successful response
                "401":
                    description: Authentication required
                "403":
                    description: Not a member of this organization
            security:
                - BearerAuth: []
            summary: List members
            tags:
                - Members
    /org/{orgId}/members/{userId}:
        delete:
            description: Remove a member from the organization. Requires admin or owner role. Cannot remove the org owner.
            parameters:
                - $ref: '#/components/parameters/OrganizationOrgId'
                - $ref: '#/components/parameters/OrganizationUserId'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        nullable: true
                                        type: object
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Member removed
                "401":
                    description: Authentication required
                "403":
                    description: Insufficient role or cannot remove owner
                "404":
                    description: Member not found
            security:
                - BearerAuth: []
            summary: Remove member
            tags:
                - Members
        get:
            description: Get a specific member's details. Requires membership (any role).
            parameters:
                - $ref: '#/components/parameters/OrganizationOrgId'
                - $ref: '#/components/parameters/OrganizationUserId'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/OrganizationMemberWithUser'
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Successful response
                "401":
                    description: Authentication required
                "403":
                    description: Not a member of this organization
                "404":
                    description: Member not found
            security:
                - BearerAuth: []
            summary: Get member
            tags:
                - Members
        put:
            description: Change a member's role. Requires admin or owner role. Cannot demote the org owner.
            parameters:
                - $ref: '#/components/parameters/OrganizationOrgId'
                - $ref: '#/components/parameters/OrganizationUserId'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OrganizationUpdateRoleRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        nullable: true
                                        type: object
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Role updated
                "400":
                    description: Invalid role
                "401":
                    description: Authentication required
                "403":
                    description: Insufficient role or cannot demote owner
                "404":
                    description: Member not found
            security:
                - BearerAuth: []
            summary: Update member role
            tags:
                - Members
    /org/{orgId}/members/{userId}/roles:
        get:
            description: |
                Returns the member's membership role, the roles assigned in the
                organization and any application-wide roles, which apply inside every
                organization. Members may read their own; reading someone else's requires
                `goauth.assignments:read` in the organization.
            operationId: rbac.org.members.roles.get
            parameters:
                - $ref: '#/components/parameters/RbacOrgId'
                - $ref: '#/components/parameters/RbacUserId'
            responses:
                "200":
                    $ref: '#/components/responses/RbacUserRoles'
                "401":
                    description: Authentication required
                "403":
                    description: Missing permission (RBAC_PERMISSION_DENIED)
                "404":
                    description: Organization not found (ORG_NOT_FOUND) or the user is not a member (ORG_MEMBER_NOT_FOUND)
            security:
                - BearerAuth: []
            summary: Get a member's roles in an organization
            tags:
                - RBAC Organization Roles
        put:
            description: |
                Makes `roles` the complete list of roles assigned to the member in the
                organization. The membership role (`owner`, `admin`, `member`) is not part
                of the list; change it through the organization module. Requires
                `goauth.assignments:write` in the organization, and every role given or
                taken away must be within what the caller holds there. The roles end when
                the membership does.
            operationId: rbac.org.members.roles.set
            parameters:
                - $ref: '#/components/parameters/RbacOrgId'
                - $ref: '#/components/parameters/RbacUserId'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RbacSetRolesRequest'
                required: true
            responses:
                "200":
                    $ref: '#/components/responses/RbacUserRoles'
                "400":
                    description: The roles list is missing
                "401":
                    description: Authentication required
                "403":
                    description: |
                        Missing permission (RBAC_PERMISSION_DENIED), a role that grants more
                        than the caller holds (RBAC_GRANT_NOT_HELD), or the application refused
                        the change (RBAC_ASSIGNMENT_REFUSED)
                "404":
                    description: |
                        Organization not found (ORG_NOT_FOUND), the user is not a member
                        (ORG_MEMBER_NOT_FOUND) or role not found (RBAC_ROLE_NOT_FOUND)
                "409":
                    description: The role comes from membership and cannot be assigned (RBAC_ROLE_SYSTEM)
                "422":
                    description: Too many roles for one member (RBAC_LIMIT_EXCEEDED)
            security:
                - BearerAuth: []
            summary: Set a member's roles in an organization
            tags:
                - RBAC Organization Roles
    /org/{orgId}/role-assignments:
        get:
            description: Requires `goauth.assignments:read` in the organization. Membership roles are not assignments and are not listed.
            operationId: rbac.org.assignments.list
            parameters:
                - $ref: '#/components/parameters/RbacOrgId'
                - $ref: '#/components/parameters/RbacLimit'
                - $ref: '#/components/parameters/RbacOffset'
                - $ref: '#/components/parameters/RbacAssignmentSortField'
                - $ref: '#/components/parameters/RbacSortDir'
                - $ref: '#/components/parameters/RbacAssignmentUserId'
                - $ref: '#/components/parameters/RbacAssignmentRole'
            responses:
                "200":
                    $ref: '#/components/responses/RbacAssignmentList'
                "401":
                    description: Authentication required
                "403":
                    description: Missing permission (RBAC_PERMISSION_DENIED)
                "404":
                    description: Organization not found (ORG_NOT_FOUND)
            security:
                - BearerAuth: []
            summary: List role assignments in an organization
            tags:
                - RBAC Organization Roles
    /org/{orgId}/roles:
        get:
            description: |
                Lists the membership roles (`owner`, `admin`, `member`), the roles defined
                in code and the organization's custom roles. Requires `goauth.roles:read`
                in the organization.
            operationId: rbac.org.roles.list
            parameters:
                - $ref: '#/components/parameters/RbacOrgId'
                - $ref: '#/components/parameters/RbacLimit'
                - $ref: '#/components/parameters/RbacOffset'
                - $ref: '#/components/parameters/RbacRoleSortField'
                - $ref: '#/components/parameters/RbacSortDir'
                - $ref: '#/components/parameters/RbacRoleQuery'
            responses:
                "200":
                    $ref: '#/components/responses/RbacRoleList'
                "401":
                    description: Authentication required
                "403":
                    description: Missing permission (RBAC_PERMISSION_DENIED)
                "404":
                    description: Organization not found (ORG_NOT_FOUND)
            security:
                - BearerAuth: []
            summary: List an organization's roles
            tags:
                - RBAC Organization Roles
        post:
            description: |
                Requires `goauth.roles:write` in the organization, and every grant of the
                new role must be within what the caller holds there. The role exists in
                this organization only.
            operationId: rbac.org.roles.create
            parameters:
                - $ref: '#/components/parameters/RbacOrgId'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RbacCreateRoleRequest'
                required: true
            responses:
                "201":
                    $ref: '#/components/responses/RbacRole'
                "400":
                    description: Malformed key, name or grant (RBAC_INVALID_ROLE)
                "401":
                    description: Authentication required
                "403":
                    description: Missing permission (RBAC_PERMISSION_DENIED) or a grant the caller does not hold (RBAC_GRANT_NOT_HELD)
                "404":
                    description: Organization not found (ORG_NOT_FOUND)
                "409":
                    description: A role with this key exists (RBAC_ROLE_EXISTS) or the key is reserved (RBAC_ROLE_SYSTEM)
                "422":
                    description: Too many roles or grants (RBAC_LIMIT_EXCEEDED)
            security:
                - BearerAuth: []
            summary: Create a role in an organization
            tags:
                - RBAC Organization Roles
    /org/{orgId}/roles/{roleKey}:
        delete:
            description: Deletes a custom role and takes it away from every member who holds it.
            operationId: rbac.org.roles.delete
            parameters:
                - $ref: '#/components/parameters/RbacOrgId'
                - $ref: '#/components/parameters/RbacRoleKey'
            responses:
                "200":
                    description: Role deleted
                "401":
                    description: Authentication required
                "403":
                    description: Missing permission (RBAC_PERMISSION_DENIED) or a grant the caller does not hold (RBAC_GRANT_NOT_HELD)
                "404":
                    description: Organization or role not found (ORG_NOT_FOUND, RBAC_ROLE_NOT_FOUND)
                "409":
                    description: The role is built in or defined in code (RBAC_ROLE_SYSTEM)
            security:
                - BearerAuth: []
            summary: Delete a role of an organization
            tags:
                - RBAC Organization Roles
        get:
            operationId: rbac.org.roles.get
            parameters:
                - $ref: '#/components/parameters/RbacOrgId'
                - $ref: '#/components/parameters/RbacRoleKey'
            responses:
                "200":
                    $ref: '#/components/responses/RbacRole'
                "401":
                    description: Authentication required
                "403":
                    description: Missing permission (RBAC_PERMISSION_DENIED)
                "404":
                    description: Organization or role not found (ORG_NOT_FOUND, RBAC_ROLE_NOT_FOUND)
            security:
                - BearerAuth: []
            summary: Get a role of an organization
            tags:
                - RBAC Organization Roles
        put:
            description: |
                Changes the name, description or grants of a custom role; fields left out
                are kept. Both the old and the new grants must be within what the caller holds.
            operationId: rbac.org.roles.update
            parameters:
                - $ref: '#/components/parameters/RbacOrgId'
                - $ref: '#/components/parameters/RbacRoleKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RbacUpdateRoleRequest'
                required: true
            responses:
                "200":
                    $ref: '#/components/responses/RbacRole'
                "400":
                    description: Malformed name or grant (RBAC_INVALID_ROLE)
                "401":
                    description: Authentication required
                "403":
                    description: Missing permission (RBAC_PERMISSION_DENIED) or a grant the caller does not hold (RBAC_GRANT_NOT_HELD)
                "404":
                    description: Organization or role not found (ORG_NOT_FOUND, RBAC_ROLE_NOT_FOUND)
                "409":
                    description: The role is built in or defined in code (RBAC_ROLE_SYSTEM)
                "422":
                    description: Too many grants (RBAC_LIMIT_EXCEEDED)
            security:
                - BearerAuth: []
            summary: Update a role of an organization
            tags:
                - RBAC Organization Roles
    /org/{orgId}/teams:
        get:
            description: |
                Lists the organization's teams. With `tree=true` every team is returned
                at once, each after its parent; otherwise the list is paginated and can
                be narrowed to one team's children (`parent_id`) or the top level (`top=true`).
            parameters:
                - in: query
                  name: tree
                  schema:
                    type: boolean
                - in: query
                  name: parent_id
                  schema:
                    type: string
                - in: query
                  name: top
                  schema:
                    type: boolean
                - description: Search name or slug
                  in: query
                  name: q
                  schema:
                    type: string
                - $ref: '#/components/parameters/TeamLimit'
                - $ref: '#/components/parameters/TeamOffset'
                - in: query
                  name: sort_field
                  schema:
                    default: created_at
                    enum:
                        - created_at
                        - name
                        - slug
                        - path
                    type: string
                - $ref: '#/components/parameters/TeamSortDir'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/TeamTeamListResponse'
                                type: object
                    description: Teams
                "401":
                    description: Authentication required
                "404":
                    description: Organization not found
                    or the caller is not a member: null
            security:
                - BearerAuth: []
            summary: List teams
            tags:
                - Teams
        parameters:
            - $ref: '#/components/parameters/TeamOrgID'
        post:
            description: A top-level team needs the organization's owner or an admin; a team beneath another needs the right to manage that team.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TeamTeamRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/TeamTeam'
                                type: object
                    description: Team created
                "400":
                    description: Invalid name or slug
                    or too deep (TEAM_TOO_DEEP): null
                    unknown parent (TEAM_INVALID_PARENT): null
                "403":
                    description: The caller cannot manage there (TEAM_FORBIDDEN)
                "409":
                    description: The slug is taken in this organization (TEAM_SLUG_TAKEN)
            security:
                - BearerAuth: []
            summary: Create a team
            tags:
                - Teams
    /org/{orgId}/teams/{teamId}:
        delete:
            description: Deletes a team and its memberships. A team with teams beneath it is refused (TEAM_HAS_SUBTEAMS).
            responses:
                "200":
                    description: Team deleted
                "403":
                    description: The caller cannot manage where the team sits
                "409":
                    description: The team has teams beneath it
            security:
                - BearerAuth: []
            summary: Delete a team
            tags:
                - Teams
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/TeamTeam'
                                type: object
                    description: The team
                "404":
                    description: Team not found (TEAM_NOT_FOUND)
            security:
                - BearerAuth: []
            summary: Get a team
            tags:
                - Teams
        parameters:
            - $ref: '#/components/parameters/TeamOrgID'
            - $ref: '#/components/parameters/TeamTeamID'
        put:
            description: Changes the name, slug or description. Use the move endpoint to change the parent.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TeamTeamRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/TeamTeam'
                                type: object
                    description: The updated team
                "403":
                    description: The caller cannot manage this team
                "409":
                    description: The slug is taken
            security:
                - BearerAuth: []
            summary: Update a team
            tags:
                - Teams
    /org/{orgId}/teams/{teamId}/members:
        get:
            parameters:
                - in: query
                  name: role
                  schema:
                    enum:
                        - lead
                        - member
                    type: string
                - $ref: '#/components/parameters/TeamLimit'
                - $ref: '#/components/parameters/TeamOffset'
                - in: query
                  name: sort_field
                  schema:
                    default: created_at
                    enum:
                        - created_at
                        - role
                    type: string
                - $ref: '#/components/parameters/TeamSortDir'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/TeamTeamMemberListResponse'
                                type: object
                    description: Members
            security:
                - BearerAuth: []
            summary: List a team's members
            tags:
                - Team members
        parameters:
            - $ref: '#/components/parameters/TeamOrgID'
            - $ref: '#/components/parameters/TeamTeamID'
        post:
            description: Adds a member of the organization to the team, as a lead or a member.
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                role:
                                    default: member
                                    enum:
                                        - lead
                                        - member
                                    type: string
                                user_id:
                                    type: string
                            required:
                                - user_id
                            type: object
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/TeamTeamMember'
                                type: object
                    description: Member added
                "403":
                    description: The caller cannot manage this team
                "404":
                    description: The user is not a member of the organization (ORG_MEMBER_NOT_FOUND)
                "409":
                    description: The user is already in the team (TEAM_MEMBER_EXISTS)
            security:
                - BearerAuth: []
            summary: Add a member
            tags:
                - Team members
    /org/{orgId}/teams/{teamId}/members/{userId}:
        delete:
            description: Leads remove members; any member may remove themselves.
            responses:
                "200":
                    description: Member removed
                "404":
                    description: Not a member of the team
            security:
                - BearerAuth: []
            summary: Remove a member
            tags:
                - Team members
        parameters:
            - $ref: '#/components/parameters/TeamOrgID'
            - $ref: '#/components/parameters/TeamTeamID'
            - in: path
              name: userId
              required: true
              schema:
                type: string
        put:
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                role:
                                    enum:
                                        - lead
                                        - member
                                    type: string
                            required:
                                - role
                            type: object
                required: true
            responses:
                "200":
                    description: Role changed
                "404":
                    description: Not a member of the team (TEAM_MEMBER_NOT_FOUND)
            security:
                - BearerAuth: []
            summary: Change a member's role
            tags:
                - Team members
    /org/{orgId}/teams/{teamId}/members/{userId}/roles:
        get:
            description: |
                Returns what the user holds in the team: roles assigned on it or on a team
                above it, the implied team role, organization roles and application-wide
                roles. Users may read their own; reading someone else's requires
                `goauth.assignments:read` in the team.
            operationId: rbac.team.members.roles.get
            parameters:
                - $ref: '#/components/parameters/RbacOrgId'
                - $ref: '#/components/parameters/RbacTeamId'
                - $ref: '#/components/parameters/RbacUserId'
            responses:
                "200":
                    $ref: '#/components/responses/RbacUserRoles'
                "401":
                    description: Authentication required
                "403":
                    description: Missing permission (RBAC_PERMISSION_DENIED)
                "404":
                    description: Team not found (TEAM_NOT_FOUND) or the user is not a member of the organization (ORG_MEMBER_NOT_FOUND)
            security:
                - BearerAuth: []
            summary: Get a user's roles in a team
            tags:
                - RBAC Team Roles
        put:
            description: |
                Makes `roles` the complete list of roles assigned to the user on this team.
                The implied `lead` and `member` roles come from team membership and are not
                part of the list. Requires `goauth.assignments:write` in the team, and every
                role given or taken away must be within what the caller holds there. The
                user must be a member of the organization; the roles end when that
                membership does.
            operationId: rbac.team.members.roles.set
            parameters:
                - $ref: '#/components/parameters/RbacOrgId'
                - $ref: '#/components/parameters/RbacTeamId'
                - $ref: '#/components/parameters/RbacUserId'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RbacSetRolesRequest'
                required: true
            responses:
                "200":
                    $ref: '#/components/responses/RbacUserRoles'
                "401":
                    description: Authentication required
                "403":
                    description: Missing permission (RBAC_PERMISSION_DENIED) or a role that grants more than the caller holds (RBAC_GRANT_NOT_HELD)
                "404":
                    description: Team not found (TEAM_NOT_FOUND), the user is not a member of the organization (ORG_MEMBER_NOT_FOUND) or role not found (RBAC_ROLE_NOT_FOUND)
                "409":
                    description: The role comes from membership and cannot be assigned (RBAC_ROLE_SYSTEM)
                "422":
                    description: Too many roles for one user (RBAC_LIMIT_EXCEEDED)
            security:
                - BearerAuth: []
            summary: Set a user's roles in a team
            tags:
                - RBAC Team Roles
    /org/{orgId}/teams/{teamId}/move:
        parameters:
            - $ref: '#/components/parameters/TeamOrgID'
            - $ref: '#/components/parameters/TeamTeamID'
        post:
            description: Puts the team, with everything beneath it, under another team of the organization, or at the top with an empty parent_id.
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                parent_id:
                                    description: The new parent; empty for the top level
                                    type: string
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/TeamTeam'
                                type: object
                    description: The moved team
                "400":
                    description: The new parent is the team itself or beneath it
                    or the move would nest too deep: null
                "403":
                    description: The caller cannot manage the old or the new place
            security:
                - BearerAuth: []
            summary: Move a team
            tags:
                - Teams
    /org/{orgId}/teams/{teamId}/role-assignments:
        get:
            description: Requires `goauth.assignments:read` in the team. Lists the assignments made on this team only, not those on teams above it.
            operationId: rbac.team.assignments.list
            parameters:
                - $ref: '#/components/parameters/RbacOrgId'
                - $ref: '#/components/parameters/RbacTeamId'
                - $ref: '#/components/parameters/RbacLimit'
                - $ref: '#/components/parameters/RbacOffset'
                - $ref: '#/components/parameters/RbacAssignmentSortField'
                - $ref: '#/components/parameters/RbacSortDir'
                - $ref: '#/components/parameters/RbacAssignmentUserId'
                - $ref: '#/components/parameters/RbacAssignmentRole'
            responses:
                "200":
                    $ref: '#/components/responses/RbacAssignmentList'
                "401":
                    description: Authentication required
                "403":
                    description: Missing permission (RBAC_PERMISSION_DENIED)
                "404":
                    description: Team not found (TEAM_NOT_FOUND)
            security:
                - BearerAuth: []
            summary: List role assignments in a team
            tags:
                - RBAC Team Roles
    /org/{orgId}/teams/{teamId}/roles:
        get:
            description: |
                The built-in team roles (`lead`, `member`), the roles defined in code that
                apply to teams and the organization's custom roles. Requires
                `goauth.roles:read` in the team. Roles are created per organization;
                creating or changing one in a team is refused.
            operationId: rbac.team.roles.list
            parameters:
                - $ref: '#/components/parameters/RbacOrgId'
                - $ref: '#/components/parameters/RbacTeamId'
                - $ref: '#/components/parameters/RbacLimit'
                - $ref: '#/components/parameters/RbacOffset'
                - $ref: '#/components/parameters/RbacRoleSortField'
                - $ref: '#/components/parameters/RbacSortDir'
                - $ref: '#/components/parameters/RbacRoleQuery'
            responses:
                "200":
                    $ref: '#/components/responses/RbacRoleList'
                "401":
                    description: Authentication required
                "403":
                    description: Missing permission (RBAC_PERMISSION_DENIED)
                "404":
                    description: Team not found in this organization (TEAM_NOT_FOUND)
            security:
                - BearerAuth: []
            summary: List the roles assignable in a team
            tags:
                - RBAC Team Roles
    /org/invitations/accept:
        post:
            description: |
                Accept an organization invitation by token. No authentication required — the token is the authorization.
                If the invited email has no account, a new user is created (name and password required).
                If the user already exists, the invitation is accepted and org membership is created.
                Returns auth tokens and membership details.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OrganizationAcceptInvitationRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/OrganizationAcceptOrgInvitationResponse'
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Invitation accepted, membership created, auth tokens returned
                "400":
                    description: Missing token, expired, or missing name/password for new user
                "404":
                    description: Invitation not found
                "409":
                    description: Already a member of this organization
            summary: Accept org invitation (public)
            tags:
                - Invitations
    /org/invitations/decline:
        post:
            description: Decline an organization invitation by token. No authentication required.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OrganizationInvitationTokenRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        nullable: true
                                        type: object
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Invitation declined
                "400":
                    description: Missing token
                "404":
                    description: Invitation not found
            summary: Decline org invitation (public)
            tags:
                - Invitations
    /org/my:
        get:
            description: List all organizations the authenticated user belongs to
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        items:
                                            $ref: '#/components/schemas/OrganizationOrganization'
                                        type: array
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Successful response
                "401":
                    description: Authentication required
            security:
                - BearerAuth: []
            summary: List my organizations
            tags:
                - Organizations
    /org/my/invitations:
        get:
            description: List all pending invitations for the authenticated user's email
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        items:
                                            $ref: '#/components/schemas/OrganizationInvitation'
                                        type: array
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Successful response
                "401":
                    description: Authentication required
            security:
                - BearerAuth: []
            summary: List my pending invitations
            tags:
                - Invitations
    /org/switch:
        post:
            description: Switch the user's active organization context. Returns new JWT tokens with the target org's claims.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OrganizationSwitchOrgRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        $ref: '#/components/schemas/OrganizationTokenPair'
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: Switched successfully, new tokens returned
                "400":
                    description: Missing org_id
                "401":
                    description: Authentication required
                "403":
                    description: User is not a member of the target organization
            security:
                - BearerAuth: []
            summary: Switch active organization
            tags:
                - Organizations
    /passkeys:
        get:
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                items:
                                    $ref: '#/components/schemas/PasskeysPasskeySummary'
                                type: array
                    description: List of passkeys
            security:
                - bearerAuth: []
            summary: List user's passkeys
            tags:
                - Passkeys Module Docs
    /passkeys/{id}:
        delete:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: Deleted
                "403":
                    description: Passkey does not belong to user
                "404":
                    description: Not found
            security:
                - bearerAuth: []
            summary: Revoke a passkey
            tags:
                - Passkeys Module Docs
        put:
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PasskeysRenameRequest'
                required: true
            responses:
                "200":
                    description: Renamed
                "403":
                    description: Passkey does not belong to user
                "404":
                    description: Not found
            security:
                - bearerAuth: []
            summary: Rename a passkey
            tags:
                - Passkeys Module Docs
    /passkeys/login/begin:
        post:
            description: |
                Start a discoverable-credential WebAuthn assertion ceremony. The client
                is not required to supply a username — the authenticator chooses the
                credential.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PasskeysBeginLoginResponse'
                    description: Assertion options
            summary: Begin passkey login
            tags:
                - Passkeys Module Docs
    /passkeys/login/finish:
        post:
            description: Verify the assertion and issue access + refresh tokens on success.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PasskeysFinishLoginRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PasskeysAuthResponse'
                    description: Auth tokens
                "401":
                    description: Invalid assertion
            summary: Finish passkey login
            tags:
                - Passkeys Module Docs
    /passkeys/register/begin:
        post:
            description: |
                Start a WebAuthn registration ceremony for the authenticated user.
                Returns PublicKeyCredentialCreationOptions for navigator.credentials.create()
                plus an opaque `challenge_token` the client must send back with the
                registration response.
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PasskeysBeginRegistrationResponse'
                    description: Creation options
            security:
                - bearerAuth: []
            summary: Begin passkey registration
            tags:
                - Passkeys Module Docs
    /passkeys/register/finish:
        post:
            description: Verify the attestation produced by the authenticator and persist the credential.
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PasskeysFinishRegistrationRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/PasskeysPasskeySummary'
                    description: Passkey registered
                "400":
                    description: Invalid attestation or expired challenge
            security:
                - bearerAuth: []
            summary: Finish passkey registration
            tags:
                - Passkeys Module Docs
    /profile:
        put:
            description: Update user profile information
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CoreUpdateProfileRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreUserDTO'
                    description: Profile updated successfully
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Validation error
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Not authenticated
            security:
                - cookieAuth: []
                  csrfToken: []
                - bearerAuth: []
                  csrfToken: []
            summary: Update user profile
            tags:
                - Core Authentication Module Docs
    /rbac/assignments:
        get:
            description: Requires `goauth.assignments:read`.
            operationId: rbac.assignments.list
            parameters:
                - $ref: '#/components/parameters/RbacLimit'
                - $ref: '#/components/parameters/RbacOffset'
                - $ref: '#/components/parameters/RbacAssignmentSortField'
                - $ref: '#/components/parameters/RbacSortDir'
                - $ref: '#/components/parameters/RbacAssignmentUserId'
                - $ref: '#/components/parameters/RbacAssignmentRole'
            responses:
                "200":
                    $ref: '#/components/responses/RbacAssignmentList'
                "401":
                    description: Authentication required
                "403":
                    description: Missing permission (RBAC_PERMISSION_DENIED)
            security:
                - BearerAuth: []
            summary: List application-wide role assignments
            tags:
                - RBAC Roles
    /rbac/permissions:
        get:
            description: |
                Lists the permissions the application has declared, for a role editor.
                The catalog fills itself as routes are wired, so a permission that is only
                checked from code appears once it was declared or first used. Requires
                `goauth.roles:read` in the scope chosen as for `/me/permissions`.
            operationId: rbac.permissions.list
            parameters:
                - $ref: '#/components/parameters/RbacScopeOrgId'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        items:
                                            $ref: '#/components/schemas/RbacPermission'
                                        type: array
                                    message:
                                        nullable: true
                                        type: string
                                type: object
                    description: The declared permissions, sorted
                "401":
                    description: Authentication required
                "403":
                    description: Missing permission (RBAC_PERMISSION_DENIED)
            security:
                - BearerAuth: []
            summary: List the permission catalog
            tags:
                - RBAC
    /rbac/roles:
        get:
            description: Lists the roles defined in code and the custom ones. Requires `goauth.roles:read`.
            operationId: rbac.roles.list
            parameters:
                - $ref: '#/components/parameters/RbacLimit'
                - $ref: '#/components/parameters/RbacOffset'
                - $ref: '#/components/parameters/RbacRoleSortField'
                - $ref: '#/components/parameters/RbacSortDir'
                - $ref: '#/components/parameters/RbacRoleQuery'
            responses:
                "200":
                    $ref: '#/components/responses/RbacRoleList'
                "401":
                    description: Authentication required
                "403":
                    description: Missing permission (RBAC_PERMISSION_DENIED)
            security:
                - BearerAuth: []
            summary: List application-wide roles
            tags:
                - RBAC Roles
        post:
            description: Requires `goauth.roles:write`, and every grant of the new role must be within what the caller holds.
            operationId: rbac.roles.create
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RbacCreateRoleRequest'
                required: true
            responses:
                "201":
                    $ref: '#/components/responses/RbacRole'
                "400":
                    description: Malformed key, name or grant (RBAC_INVALID_ROLE)
                "401":
                    description: Authentication required
                "403":
                    description: Missing permission (RBAC_PERMISSION_DENIED) or a grant the caller does not hold (RBAC_GRANT_NOT_HELD)
                "409":
                    description: A role with this key exists (RBAC_ROLE_EXISTS) or the key is reserved (RBAC_ROLE_SYSTEM)
                "422":
                    description: Too many roles or grants (RBAC_LIMIT_EXCEEDED)
            security:
                - BearerAuth: []
            summary: Create an application-wide role
            tags:
                - RBAC Roles
    /rbac/roles/{roleKey}:
        delete:
            description: Deletes a custom role and takes it away from everyone who holds it.
            operationId: rbac.roles.delete
            parameters:
                - $ref: '#/components/parameters/RbacRoleKey'
            responses:
                "200":
                    description: Role deleted
                "401":
                    description: Authentication required
                "403":
                    description: Missing permission (RBAC_PERMISSION_DENIED) or a grant the caller does not hold (RBAC_GRANT_NOT_HELD)
                "404":
                    description: Role not found (RBAC_ROLE_NOT_FOUND)
                "409":
                    description: The role is defined in code (RBAC_ROLE_SYSTEM)
            security:
                - BearerAuth: []
            summary: Delete an application-wide role
            tags:
                - RBAC Roles
        get:
            operationId: rbac.roles.get
            parameters:
                - $ref: '#/components/parameters/RbacRoleKey'
            responses:
                "200":
                    $ref: '#/components/responses/RbacRole'
                "401":
                    description: Authentication required
                "403":
                    description: Missing permission (RBAC_PERMISSION_DENIED)
                "404":
                    description: Role not found (RBAC_ROLE_NOT_FOUND)
            security:
                - BearerAuth: []
            summary: Get an application-wide role
            tags:
                - RBAC Roles
        put:
            description: |
                Changes the name, description or grants of a custom role; fields left out
                are kept. The change applies to everyone who holds the role on their next
                request. Both the old and the new grants must be within what the caller holds.
            operationId: rbac.roles.update
            parameters:
                - $ref: '#/components/parameters/RbacRoleKey'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RbacUpdateRoleRequest'
                required: true
            responses:
                "200":
                    $ref: '#/components/responses/RbacRole'
                "400":
                    description: Malformed name or grant (RBAC_INVALID_ROLE)
                "401":
                    description: Authentication required
                "403":
                    description: Missing permission (RBAC_PERMISSION_DENIED) or a grant the caller does not hold (RBAC_GRANT_NOT_HELD)
                "404":
                    description: Role not found (RBAC_ROLE_NOT_FOUND)
                "409":
                    description: The role is defined in code (RBAC_ROLE_SYSTEM)
                "422":
                    description: Too many grants (RBAC_LIMIT_EXCEEDED)
            security:
                - BearerAuth: []
            summary: Update an application-wide role
            tags:
                - RBAC Roles
    /rbac/users/{userId}/roles:
        get:
            description: Users may read their own roles. Reading someone else's requires `goauth.assignments:read`.
            operationId: rbac.users.roles.get
            parameters:
                - $ref: '#/components/parameters/RbacUserId'
            responses:
                "200":
                    $ref: '#/components/responses/RbacUserRoles'
                "401":
                    description: Authentication required
                "403":
                    description: Missing permission (RBAC_PERMISSION_DENIED)
                "404":
                    description: User not found (USER_NOT_FOUND)
            security:
                - BearerAuth: []
            summary: Get a user's application-wide roles
            tags:
                - RBAC Roles
        put:
            description: |
                Makes `roles` the complete list of roles assigned to the user
                application-wide. Roles that are implied (the super admin flag) are not
                part of the list. Requires `goauth.assignments:write`, and every role
                given or taken away must be within what the caller holds.
            operationId: rbac.users.roles.set
            parameters:
                - $ref: '#/components/parameters/RbacUserId'
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/RbacSetRolesRequest'
                required: true
            responses:
                "200":
                    $ref: '#/components/responses/RbacUserRoles'
                "400":
                    description: The roles list is missing
                "401":
                    description: Authentication required
                "403":
                    description: |
                        Missing permission (RBAC_PERMISSION_DENIED), a role that grants more
                        than the caller holds (RBAC_GRANT_NOT_HELD), or the application refused
                        the change (RBAC_ASSIGNMENT_REFUSED)
                "404":
                    description: User not found (USER_NOT_FOUND) or role not found (RBAC_ROLE_NOT_FOUND)
                "409":
                    description: The role is implied and cannot be assigned (RBAC_ROLE_SYSTEM)
                "422":
                    description: Too many roles for one user (RBAC_LIMIT_EXCEEDED)
            security:
                - BearerAuth: []
            summary: Set a user's application-wide roles
            tags:
                - RBAC Roles
    /refresh:
        post:
            description: |
                The old refresh token is revoked after use (rotation).
                Reusing an old refresh token will fail with 401.
            operationId: statelessRefresh
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                refresh_token:
                                    description: JWT refresh token from login or previous refresh
                                    type: string
                            required:
                                - refresh_token
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StatelessAuthResponse'
                    description: Tokens refreshed
                "401":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/StatelessErrorResponse'
                    description: Invalid or revoked refresh token
            summary: Exchange a refresh token for new access and refresh tokens
            tags:
                - Authentication
    /resend-verification-email:
        post:
            description: Resend verification email (deletes any existing token first)
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CoreSendVerificationEmailRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreMessageResponse'
                    description: Verification email resent
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Validation error
            security:
                - csrfToken: []
            summary: Resend email verification
            tags:
                - Core Authentication Module Docs
    /resend-verification-phone:
        post:
            description: Resend verification SMS (deletes any existing token first)
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CoreSendVerificationPhoneRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreMessageResponse'
                    description: Verification SMS resent
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Validation error
            security:
                - csrfToken: []
            summary: Resend phone verification
            tags:
                - Core Authentication Module Docs
    /reset-password:
        post:
            description: Reset password using token/code from email/SMS
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CoreResetPasswordRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreMessageResponse'
                    description: Password reset successfully
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Validation error or invalid token/code
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: User not found
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Too many wrong codes; the code is invalidated, request a new one
            security:
                - csrfToken: []
            summary: Reset password
            tags:
                - Core Authentication Module Docs
    /saml/{provider}/acs:
        post:
            description: |
                Receives the SAMLResponse posted by the identity provider (HTTP-POST
                binding), verifies its signature, audience, destination, validity window
                and InResponseTo, then signs the user in. Depending on configuration the
                response is a redirect with tokens in the URL fragment, a redirect with
                cookies only, or a JSON AuthResponse.
            operationId: saml.acs
            parameters:
                - in: path
                  name: provider
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/x-www-form-urlencoded:
                        schema:
                            properties:
                                RelayState:
                                    description: Request ID echoed by the IdP; absent for IdP-initiated logins
                                    type: string
                                SAMLResponse:
                                    description: Base64-encoded SAML Response
                                    type: string
                            required:
                                - SAMLResponse
                            type: object
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: '#/components/schemas/SamlAuthResponse'
                                    - $ref: '#/components/schemas/SamlChallengeResponse'
                    description: Authenticated (no redirect URL configured) or a challenge is required
                "302":
                    description: Redirect to the frontend with tokens in the URL fragment, or to ErrorRedirectURL on failure
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SamlErrorResponse'
                    description: The response could not be verified, the request is unknown or expired, or IdP-initiated login is disabled
                "403":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SamlErrorResponse'
                    description: Signup or account linking is disabled
            summary: Assertion Consumer Service
            tags:
                - SAML
    /saml/{provider}/login:
        get:
            description: |
                Builds a SAML AuthnRequest and redirects the browser to the identity
                provider's single sign-on endpoint (HTTP-Redirect binding). The request
                ID is sent as RelayState and stored in a cookie so the response can be
                bound to this browser.
            operationId: saml.login
            parameters:
                - description: Connection name as configured in SAMLModuleConfig.Providers
                  in: path
                  name: provider
                  required: true
                  schema:
                    type: string
                - description: |
                    Optional frontend URL to redirect to after a successful login. It must
                    share its origin with DefaultRedirectURL, ErrorRedirectURL or
                    FrontendConfig.URL. Tokens are passed in the URL fragment.
                  in: query
                  name: redirect_uri
                  required: false
                  schema:
                    format: uri
                    type: string
            responses:
                "302":
                    description: Redirect to the identity provider
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SamlErrorResponse'
                    description: Unknown connection
            summary: Start SP-initiated login
            tags:
                - SAML
    /saml/{provider}/metadata:
        get:
            description: Returns the SP metadata document to import into the identity provider.
            operationId: saml.metadata
            parameters:
                - in: path
                  name: provider
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/samlmetadata+xml:
                            schema:
                                type: string
                    description: SP metadata
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SamlErrorResponse'
                    description: Unknown connection
            summary: Service provider metadata
            tags:
                - SAML
    /saml/providers:
        get:
            description: Returns the configured identity-provider connections with their login and metadata URLs.
            operationId: saml.providers
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SamlProvidersResponse'
                    description: List of connections
            summary: List SAML connections
            tags:
                - SAML
    /send-verification-email:
        post:
            description: Send verification email to user's email address
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CoreSendVerificationEmailRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreMessageResponse'
                    description: Verification email sent (always succeeds to prevent user enumeration)
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Validation error
            security:
                - csrfToken: []
            summary: Send email verification
            tags:
                - Core Authentication Module Docs
    /send-verification-phone:
        post:
            description: Send verification SMS with OTP code to user's phone number
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CoreSendVerificationPhoneRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreMessageResponse'
                    description: Verification SMS sent (always succeeds to prevent user enumeration)
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Validation error
            security:
                - csrfToken: []
            summary: Send phone verification
            tags:
                - Core Authentication Module Docs
    /signup:
        post:
            description: Create a new user account with email/password
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CoreSignupRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreAuthResponse'
                    description: User created successfully
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Validation error
                "409":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: User already exists
            security:
                - csrfToken: []
            summary: Register a new user
            tags:
                - Core Authentication Module Docs
    /verify-email:
        get:
            description: Verify email using token from email link. Redirects to frontend with success/error status if frontend config is set, otherwise returns JSON.
            parameters:
                - description: Verification token from email
                  example: abc123def456
                  in: query
                  name: token
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreMessageResponse'
                    description: Email verified (JSON fallback when no frontend config)
                "302":
                    description: Redirects to frontend verify-email page with status query parameter
                    headers:
                        Location:
                            description: Redirect URL to frontend
                            schema:
                                example: http://localhost:3000/verify-email?status=success
                                type: string
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Invalid or expired token
            summary: Verify email address
            tags:
                - Core Authentication Module Docs
    /verify-phone:
        post:
            description: Verify phone number using 6-digit OTP code from SMS
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CoreVerifyPhoneRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreMessageResponse'
                    description: Phone verified successfully
                "400":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Invalid or expired code
                "429":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CoreErrorResponse'
                    description: Too many wrong codes; the code is invalidated, request a new one
            security:
                - csrfToken: []
            summary: Verify phone number
            tags:
                - Core Authentication Module Docs
servers:
    - description: Configured BasePath
      url: '{baseUrl}'
      variables:
        baseUrl:
            default: /auth
            description: Value of config.BasePath
tags:
    - description: Audit Logs log management endpoints
      name: Audit Logs
    - description: Core Authentication Module API Documentation - Handles user authentication, profile management, email/phone verification, password recovery, and account operations
      name: Core Authentication Module Docs
    - description: Organization invitation flow
      name: Invitations
    - description: Organization member management
      name: Members
    - description: OAuth 2.0 / OpenID Connect authentication endpoints
      name: OAuth
    - description: Administration of client applications (requires IDPModuleConfig.AdminAPI and the admin module)
      name: OIDC Admin
    - description: Consent and connected applications, called by the host's frontend for the signed-in user
      name: OIDC Consent
    - description: OpenID Connect protocol endpoints, called by client applications
      name: OIDC Provider
    - description: Organization CRUD and switching
      name: Organizations
    - description: |
        WebAuthn / Passkeys — phishing-resistant, shared-secret-free authentication.
        v1 supports primary login via discoverable credentials plus post-signup
        credential management. Use-as-2FA (passkey as a second factor during
        password login) is planned for v1.1 via the AuthInterceptors framework.
      name: Passkeys Module Docs
    - description: The caller's own permissions and the permission catalog
      name: RBAC
    - description: Roles and assignments inside one organization
      name: RBAC Organization Roles
    - description: Application-wide roles and their assignments
      name: RBAC Roles
    - description: Roles held inside one team (Config.Teams); they apply to the team and every team beneath it
      name: RBAC Team Roles
    - description: Who is in a team
      name: Team members
    - description: Teams of an organization
      name: Teams
    - description: Two-factor authentication (2FA) endpoints for enhanced account security
      name: Two-Factor Authentication Module
    - description: User management endpoints
      name: Users
