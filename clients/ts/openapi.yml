components:
    parameters:
        AdminLimit:
            description: Maximum number of items to return
            in: query
            name: limit
            schema:
                default: 20
                maximum: 100
                type: integer
        AdminOffset:
            description: Number of items to skip
            in: query
            name: offset
            schema:
                default: 0
                minimum: 0
                type: integer
        AdminSortDir:
            description: Sort direction
            in: query
            name: sort_dir
            schema:
                default: desc
                enum:
                    - asc
                    - desc
                type: string
        AdminSortField:
            description: Field to sort results by
            in: query
            name: sort_field
            schema:
                default: created_at
                enum:
                    - created_at
                    - email
                    - username
                    - name
                type: string
        AuditLimit:
            description: Maximum number of items to return
            in: query
            name: limit
            schema:
                default: 20
                maximum: 100
                type: integer
        AuditOffset:
            description: Number of items to skip
            in: query
            name: offset
            schema:
                default: 0
                minimum: 0
                type: integer
        AuditSortDir:
            description: Sort direction
            in: query
            name: sort_dir
            schema:
                default: desc
                enum:
                    - asc
                    - desc
                type: string
        AuditSortField:
            description: Field to sort results by
            in: query
            name: sort_field
            schema:
                default: created_at
                enum:
                    - created_at
                    - action
                    - severity
                    - actor_id
                type: string
        IdpClientRowID:
            description: The client's internal ID (`id`, not `client_id`)
            in: path
            name: id
            required: true
            schema:
                format: uuid
                type: string
        IdpClientSortField:
            description: Field to sort by
            in: query
            name: sort_field
            schema:
                default: created_at
                enum:
                    - created_at
                    - name
                    - last_used_at
                type: string
        IdpGrantSortField:
            description: Field to sort by
            in: query
            name: sort_field
            schema:
                default: created_at
                enum:
                    - created_at
                    - last_used_at
                type: string
        IdpLimit:
            description: Maximum number of items to return
            in: query
            name: limit
            schema:
                default: 20
                maximum: 100
                type: integer
        IdpOffset:
            description: Number of items to skip
            in: query
            name: offset
            schema:
                default: 0
                minimum: 0
                type: integer
        IdpRequestID:
            description: The `request_id` the consent page was opened with
            in: path
            name: id
            required: true
            schema:
                type: string
        IdpSortDir:
            description: Sort direction
            in: query
            name: sort_dir
            schema:
                default: desc
                enum:
                    - asc
                    - desc
                type: string
        InvitationInvitationSortField:
            description: Field to sort invitations by
            in: query
            name: sort_field
            schema:
                default: created_at
                enum:
                    - created_at
                    - expires_at
                    - status
                    - purpose
                type: string
        InvitationLimit:
            description: Maximum number of items to return
            in: query
            name: limit
            schema:
                default: 20
                maximum: 100
                type: integer
        InvitationOffset:
            description: Number of items to skip
            in: query
            name: offset
            schema:
                default: 0
                minimum: 0
                type: integer
        InvitationSortDir:
            description: Sort direction
            in: query
            name: sort_dir
            schema:
                default: desc
                enum:
                    - asc
                    - desc
                type: string
        OrganizationInvitationSortField:
            description: Field to sort invitations by
            in: query
            name: sort_field
            schema:
                default: created_at
                enum:
                    - created_at
                    - expires_at
                    - status
                type: string
        OrganizationLimit:
            description: Maximum number of items to return
            in: query
            name: limit
            schema:
                default: 20
                maximum: 100
                type: integer
        OrganizationMemberSortField:
            description: Field to sort members by
            in: query
            name: sort_field
            schema:
                default: joined_at
                enum:
                    - joined_at
                    - role
                type: string
        OrganizationOffset:
            description: Number of items to skip
            in: query
            name: offset
            schema:
                default: 0
                minimum: 0
                type: integer
        OrganizationOrgId:
            description: Organization ID
            in: path
            name: orgId
            required: true
            schema:
                format: uuid
                type: string
        OrganizationSortDir:
            description: Sort direction
            in: query
            name: sort_dir
            schema:
                default: desc
                enum:
                    - asc
                    - desc
                type: string
        OrganizationUserId:
            description: User ID
            in: path
            name: userId
            required: true
            schema:
                format: uuid
                type: string
        RbacAssignmentRole:
            description: Keep only assignments of this role key
            in: query
            name: role
            schema:
                type: string
        RbacAssignmentSortField:
            description: Field to sort assignments by
            in: query
            name: sort_field
            schema:
                default: created_at
                enum:
                    - created_at
                    - role_key
                    - user_id
                type: string
        RbacAssignmentUserId:
            description: Keep only assignments of this user
            in: query
            name: user_id
            schema:
                format: uuid
                type: string
        RbacLimit:
            description: Maximum number of items to return
            in: query
            name: limit
            schema:
                default: 20
                maximum: 100
                type: integer
        RbacOffset:
            description: Number of items to skip
            in: query
            name: offset
            schema:
                default: 0
                minimum: 0
                type: integer
        RbacOrgId:
            description: Organization ID
            in: path
            name: orgId
            required: true
            schema:
                format: uuid
                type: string
        RbacRoleKey:
            description: Role key
            in: path
            name: roleKey
            required: true
            schema:
                pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
                type: string
        RbacRoleQuery:
            description: Keep only roles whose key or name contains this text
            in: query
            name: query
            schema:
                type: string
        RbacRoleSortField:
            description: Field to sort roles by. Roles defined in code have no creation time and sort before custom ones.
            in: query
            name: sort_field
            schema:
                default: created_at
                enum:
                    - created_at
                    - key
                    - name
                type: string
        RbacScopeOrgId:
            description: Organization to answer for. Defaults to the organization the caller is signed in to.
            in: query
            name: org_id
            schema:
                format: uuid
                type: string
        RbacSortDir:
            description: Sort direction
            in: query
            name: sort_dir
            schema:
                default: desc
                enum:
                    - asc
                    - desc
                type: string
        RbacTeamId:
            description: Team ID
            in: path
            name: teamId
            required: true
            schema:
                format: uuid
                type: string
        RbacUserId:
            description: User ID
            in: path
            name: userId
            required: true
            schema:
                format: uuid
                type: string
        TeamLimit:
            description: Maximum number of items to return
            in: query
            name: limit
            schema:
                default: 20
                maximum: 100
                type: integer
        TeamOffset:
            description: Number of items to skip
            in: query
            name: offset
            schema:
                default: 0
                minimum: 0
                type: integer
        TeamOrgID:
            in: path
            name: orgId
            required: true
            schema:
                type: string
        TeamSortDir:
            description: Sort direction
            in: query
            name: sort_dir
            schema:
                default: desc
                enum:
                    - asc
                    - desc
                type: string
        TeamTeamID:
            in: path
            name: teamId
            required: true
            schema:
                type: string
    responses:
        RatelimitRateLimitExceeded:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/RatelimitRateLimitError'
            description: |
                The client exceeded a rate-limit rule. Any built-in route covered by the active rules can return this response. The default rules cover login, two-factor, passkey and magic-link verification, password reset, contact verification, verification and reset sends, signup, availability checks, token refresh, and OAuth or passkey ceremony starts. Wait for the number of seconds in Retry-After before retrying.
            headers:
                RateLimit-Limit:
                    description: Burst capacity of the rule that rejected the request.
                    schema:
                        type: integer
                RateLimit-Remaining:
                    description: Requests remaining in the current budget (0 on rejection).
                    schema:
                        type: integer
                RateLimit-Reset:
                    description: Seconds until the budget is fully replenished.
                    schema:
                        type: integer
                Retry-After:
                    description: Seconds to wait before retrying.
                    schema:
                        minimum: 1
                        type: integer
        RbacAssignmentList:
            content:
                application/json:
                    schema:
                        properties:
                            data:
                                $ref: '#/components/schemas/RbacAssignmentListResponse'
                            message:
                                nullable: true
                                type: string
                        type: object
            description: A page of role assignments
        RbacRole:
            content:
                application/json:
                    schema:
                        properties:
                            data:
                                $ref: '#/components/schemas/RbacRole'
                            message:
                                nullable: true
                                type: string
                        type: object
            description: The role
        RbacRoleList:
            content:
                application/json:
                    schema:
                        properties:
                            data:
                                $ref: '#/components/schemas/RbacRoleListResponse'
                            message:
                                nullable: true
                                type: string
                        type: object
            description: A page of roles
        RbacUserRoles:
            content:
                application/json:
                    schema:
                        properties:
                            data:
                                $ref: '#/components/schemas/RbacUserRoles'
                            message:
                                nullable: true
                                type: string
                        type: object
            description: What the user holds in the scope
    schemas:
        AdminUser:
            properties:
                active:
                    type: boolean
                avatar:
                    type: string
                ban_reason:
                    description: The administrators' note on why; not shown to the user
                    type: string
                banned_at:
                    description: When an administrator banned the user; absent when not banned
                    format: date-time
                    type: string
                banned_until:
                    description: When the ban ends by itself; absent for a ban that lasts until lifted
                    format: date-time
                    type: string
                created_at:
                    format: date-time
                    type: string
                email:
                    format: email
                    type: string
                email_verified:
                    type: boolean
                first_name:
                    type: string
                id:
                    format: uuid
                    type: string
                is_super_admin:
                    type: boolean
                last_login_at:
                    format: date-time
                    nullable: true
                    type: string
                last_name:
                    type: string
                name:
                    type: string
                phone_number:
                    type: string
                phone_number_verified:
                    type: boolean
                updated_at:
                    format: date-time
                    nullable: true
                    type: string
                username:
                    type: string
            type: object
        AdminUserUpdate:
            properties:
                active:
                    type: boolean
                avatar:
                    type: string
                email:
                    format: email
                    type: string
                first_name:
                    type: string
                is_super_admin:
                    type: boolean
                last_name:
                    type: string
                name:
                    type: string
                phone_number:
                    type: string
                username:
                    type: string
            type: object
        AuditAuditLog:
            properties:
                action:
                    description: Action type
                    example: auth.login.success
                    type: string
                actor_id:
                    description: User who performed the action
                    format: uuid
                    type: string
                actor_type:
                    default: user
                    enum:
                        - user
                        - admin
                        - system
                    type: string
                created_at:
                    format: date-time
                    type: string
                details:
                    description: Human-readable description
                    type: string
                id:
                    format: uuid
                    type: string
                ip_address:
                    example: 192.168.1.1
                    type: string
                metadata:
                    description: JSON metadata
                    example: '{"ip": "192.168.1.1", "user_agent": "Mozilla/5.0..."}'
                    type: string
                organization_id:
                    description: Organization context (future use)
                    format: uuid
                    nullable: true
                    type: string
                severity:
                    default: info
                    enum:
                        - info
                        - warning
                        - critical
                    type: string
                target_id:
                    description: Resource affected by the action
                    format: uuid
                    nullable: true
                    type: string
                target_type:
                    description: Type of resource affected
                    example: user
                    nullable: true
                    type: string
                user_agent:
                    example: Mozilla/5.0 (Windows NT 10.0; Win64; x64)...
                    type: string
            required:
                - id
                - action
                - actor_id
                - created_at
            type: object
        AuditAuditLogListResponse:
            properties:
                data:
                    properties:
                        list:
                            items:
                                $ref: '#/components/schemas/AuditAuditLog'
                            type: array
                        sort_dir:
                            enum:
                                - asc
                                - desc
                            example: desc
                            type: string
                        sort_field:
                            example: created_at
                            type: string
                        total:
                            type: integer
                    type: object
                message:
                    nullable: true
                    type: string
            type: object
        CoreAuthResponse:
            properties:
                expires_in:
                    description: Token expiration time in seconds
                    example: 3600
                    type: integer
                message:
                    description: Success message
                    example: Login successful
                    type: string
                refresh_token:
                    description: Refresh token
                    example: def456ghi789
                    type: string
                token:
                    description: JWT access token
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                    type: string
                user:
                    $ref: '#/components/schemas/CoreUserDTO'
            type: object
        CoreChangePasswordRequest:
            properties:
                new_password:
                    description: New password (minimum 8 characters)
                    example: newSecurePassword123
                    minLength: 8
                    type: string
                old_password:
                    description: Current password
                    example: oldPassword123
                    type: string
            required:
                - old_password
                - new_password
            type: object
        CoreCheckAvailabilityRequest:
            description: Provide exactly one of email, username, or phone
            properties:
                email:
                    description: Email to check
                    example: user@example.com
                    format: email
                    type: string
                phone:
                    description: Phone number to check
                    example: 1234567890
                    pattern: ^\+[1-9]\d{1,14}$
                    type: string
                username:
                    description: Username to check
                    example: john_doe
                    type: string
            type: object
        CoreCheckAvailabilityResponse:
            properties:
                available:
                    description: Whether the field is available
                    example: true
                    type: boolean
                field:
                    description: Field that was checked
                    example: email
                    type: string
                message:
                    description: Availability message
                    example: Email is available
                    type: string
            type: object
        CoreErrorResponse:
            properties:
                code:
                    description: HTTP status code
                    example: 400
                    type: integer
                error:
                    description: Error message
                    example: Validation failed
                    type: string
                message:
                    description: Additional error information
                    example: Additional error details
                    type: string
            type: object
        CoreForgotPasswordRequest:
            properties:
                email:
                    description: Email address (provide email or phone)
                    example: user@example.com
                    format: email
                    type: string
                phone:
                    description: Phone number in E.164 format (provide email or phone)
                    example: 1234567890
                    pattern: ^\+[1-9]\d{1,14}$
                    type: string
            type: object
        CoreJWK:
            description: One public key in JSON Web Key format (RFC 7517). Only the fields needed by relying parties are populated — private components are never included.
            properties:
                alg:
                    example: RS256
                    type: string
                crv:
                    description: EC curve name (EC keys only)
                    example: P-256
                    type: string
                e:
                    description: RSA exponent, base64url-encoded (RSA keys only)
                    type: string
                kid:
                    description: Key ID — matches the JWT header "kid"
                    type: string
                kty:
                    description: Key type ("RSA" or "EC")
                    example: RSA
                    type: string
                "n":
                    description: RSA modulus, base64url-encoded (RSA keys only)
                    type: string
                use:
                    example: sig
                    type: string
                x:
                    description: EC x-coordinate, base64url-encoded (EC keys only)
                    type: string
                "y":
                    description: EC y-coordinate, base64url-encoded (EC keys only)
                    type: string
            type: object
        CoreJWKS:
            properties:
                keys:
                    items:
                        $ref: '#/components/schemas/CoreJWK'
                    type: array
            type: object
        CoreLoginRequest:
            properties:
                email:
                    description: Email address
                    example: user@example.com
                    format: email
                    type: string
                password:
                    description: Password
                    example: securePassword123
                    type: string
                username:
                    description: Username
                    example: john_doe
                    type: string
            required:
                - password
            type: object
        CoreMessageResponse:
            properties:
                message:
                    description: Response message
                    example: Operation completed successfully
                    type: string
                success:
                    description: Operation success status
                    example: true
                    type: boolean
            type: object
        CoreResetPasswordRequest:
            properties:
                code:
                    description: Reset code from SMS
                    example: "123456"
                    type: string
                email:
                    description: Email address
                    example: user@example.com
                    format: email
                    type: string
                new_password:
                    description: New password (minimum 8 characters)
                    example: newSecurePassword123
                    minLength: 8
                    type: string
                phone:
                    description: Phone number
                    example: 1234567890
                    pattern: ^\+[1-9]\d{1,14}$
                    type: string
                token:
                    description: Reset token from email
                    example: abc123def456
                    type: string
            required:
                - new_password
            type: object
        CoreSendVerificationEmailRequest:
            properties:
                email:
                    description: Email address to verify
                    example: user@example.com
                    format: email
                    type: string
            required:
                - email
            type: object
        CoreSendVerificationPhoneRequest:
            properties:
                phone:
                    description: Phone number in E.164 format
                    example: 1234567890
                    pattern: ^\+[1-9]\d{1,14}$
                    type: string
            required:
                - phone
            type: object
        CoreSignupRequest:
            properties:
                email:
                    description: User email address
                    example: user@example.com
                    format: email
                    type: string
                name:
                    description: Full name
                    example: John Doe
                    type: string
                password:
                    description: Password (minimum 8 characters)
                    example: securePassword123
                    minLength: 8
                    type: string
                phone:
                    description: Phone number in E.164 format
                    example: 1234567890
                    pattern: ^\+[1-9]\d{1,14}$
                    type: string
                username:
                    description: Username (3-30 chars, letters, numbers, underscore, hyphen)
                    example: john_doe
                    maxLength: 30
                    minLength: 3
                    pattern: ^[a-zA-Z0-9_-]+$
                    type: string
            required:
                - password
            type: object
        CoreUpdateProfileRequest:
            properties:
                avatar:
                    description: Avatar image URL
                    example: https://example.com/avatar.jpg
                    format: uri
                    type: string
                name:
                    description: Full name
                    example: John Doe
                    type: string
                phone:
                    description: Phone number in E.164 format
                    example: 1234567890
                    pattern: ^\+[1-9]\d{1,14}$
                    type: string
            type: object
        CoreUserDTO:
            properties:
                active:
                    description: Account active status
                    example: true
                    type: boolean
                avatar:
                    description: Avatar image URL
                    example: https://example.com/avatar.jpg
                    format: uri
                    type: string
                created_at:
                    description: Account creation timestamp
                    example: "2023-01-01T00:00:00Z"
                    format: date-time
                    type: string
                email:
                    description: Email address
                    example: user@example.com
                    format: email
                    type: string
                email_verified:
                    description: Email verification status
                    example: true
                    type: boolean
                id:
                    description: User unique identifier
                    example: 123e4567-e89b-12d3-a456-426614174000
                    format: uuid
                    type: string
                name:
                    description: Full name
                    example: John Doe
                    type: string
                phone:
                    description: Phone number
                    example: 1234567890
                    type: string
                phone_verified:
                    description: Phone verification status
                    example: false
                    type: boolean
                updated_at:
                    description: Last update timestamp
                    example: "2023-01-01T00:00:00Z"
                    format: date-time
                    type: string
                username:
                    description: Username
                    example: john_doe
                    type: string
            type: object
        CoreVerifyPhoneRequest:
            properties:
                code:
                    description: 6-digit verification code from SMS
                    example: "123456"
                    pattern: ^\d{6}$
                    type: string
                phone:
                    description: Phone number being verified
                    example: 1234567890
                    pattern: ^\+[1-9]\d{1,14}$
                    type: string
            required:
                - code
                - phone
            type: object
        CsrfCSRFTokenResponse:
            properties:
                data:
                    properties:
                        csrf_token:
                            description: HMAC-signed CSRF token
                            type: string
                    type: object
            type: object
        CsrfErrorResponse:
            properties:
                error:
                    properties:
                        code:
                            example: INTERNAL_ERROR
                            type: string
                        message:
                            example: Failed to generate CSRF token
                            type: string
                    type: object
            type: object
        IdpClient:
            properties:
                client_id:
                    description: Public identifier the application sends
                    type: string
                client_secret:
                    description: Present only in the response that creates the client, rotates its secret, or turns a public client into a confidential one
                    type: string
                client_uri:
                    format: uri
                    type: string
                created_at:
                    format: date-time
                    type: string
                disabled:
                    type: boolean
                id:
                    description: Internal ID, used in the admin endpoints
                    format: uuid
                    type: string
                last_used_at:
                    format: date-time
                    type: string
                logo_uri:
                    format: uri
                    type: string
                managed:
                    description: Declared in configuration; read-only through this API
                    type: boolean
                name:
                    type: string
                public:
                    type: boolean
                redirect_uris:
                    items:
                        format: uri
                        type: string
                    type: array
                require_pkce:
                    type: boolean
                scopes:
                    items:
                        type: string
                    type: array
                skip_consent:
                    type: boolean
                updated_at:
                    format: date-time
                    type: string
            type: object
        IdpClientRequest:
            properties:
                client_id:
                    description: Public identifier, 3 to 128 characters of letters, digits, `.`, `_`, `~` or `-`. Read only when creating; empty generates one.
                    type: string
                client_uri:
                    format: uri
                    type: string
                disabled:
                    type: boolean
                logo_uri:
                    format: uri
                    type: string
                name:
                    description: Shown to the user on the consent page
                    maxLength: 120
                    type: string
                public:
                    description: An application that cannot keep a secret. It gets none and must use PKCE.
                    type: boolean
                redirect_uris:
                    description: Exact addresses the user may be sent back to. https, http on a loopback host, or a private-use scheme of a native application.
                    items:
                        format: uri
                        type: string
                    maxItems: 20
                    minItems: 1
                    type: array
                require_pkce:
                    default: true
                    description: Refuse authorization requests without a PKCE challenge. Always true for a public client.
                    type: boolean
                scopes:
                    description: What the client may request. Must include `openid`. Default openid, profile, email.
                    items:
                        enum:
                            - openid
                            - profile
                            - email
                            - phone
                            - offline_access
                        type: string
                    type: array
                skip_consent:
                    description: An application the host operates itself; users are not asked to approve it.
                    type: boolean
            required:
                - name
                - redirect_uris
            type: object
        IdpConsentDetails:
            properties:
                client:
                    properties:
                        client_id:
                            type: string
                        client_uri:
                            format: uri
                            type: string
                        logo_uri:
                            format: uri
                            type: string
                        name:
                            type: string
                    type: object
                consent_required:
                    description: False when there is nothing to ask and the page can approve without a prompt
                    type: boolean
                expires_at:
                    format: date-time
                    type: string
                login_hint:
                    type: string
                login_required:
                    description: True when the user has to sign in again before approving
                    type: boolean
                redirect_host:
                    description: Where the user is sent after the decision
                    example: dashboard.example.com
                    type: string
                request_id:
                    type: string
                scopes:
                    items:
                        properties:
                            description:
