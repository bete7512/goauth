components:
  schemas:
    RateLimitError:
      type: object
      description: Error envelope returned with HTTP 429 when a rate-limit rule rejects a request.
      properties:
        data:
          type: object
          properties:
            code:
              type: string
              enum: [RATE_LIMIT_EXCEEDED]
            message:
              type: string
              example: Too many requests. Please retry later.
  responses:
    RateLimitExceeded:
      description: >
        The client exceeded a rate-limit rule. Any built-in route covered by the active rules can
        return this response. The default rules cover login, two-factor, passkey and magic-link
        verification, password reset, contact verification, verification and reset sends, signup,
        availability checks, token refresh, and OAuth or passkey ceremony starts. Wait for the
        number of seconds in Retry-After before retrying.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
        RateLimit-Limit:
          description: Burst capacity of the rule that rejected the request.
          schema:
            type: integer
        RateLimit-Remaining:
          description: Requests remaining in the current budget (0 on rejection).
          schema:
            type: integer
        RateLimit-Reset:
          description: Seconds until the budget is fully replenished.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitError'
